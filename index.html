<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#E8EBF0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0F14" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ghisa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/svg+xml" href="icone/2-manubrio.svg">
<style>:root{color-scheme:light}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Ghisa Coach</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: liquid-glass panels floating over a soft field of olympic-plate colours; glass header on top, floating glass tab capsule at the bottom, one column of panels (max 920px) */
:root{
  --bg:#E8EBF0; --ink:#13171D; --muted:#576170; --line:rgba(19,23,29,.10);
  --glass:rgba(255,255,255,.50); --glass-strong:rgba(255,255,255,.80); --glass-edge:rgba(255,255,255,.80);
  --glass-shadow:rgba(28,38,62,.16); --sheen:rgba(255,255,255,.70); --field:rgba(255,255,255,.62); --sunken:rgba(24,34,52,.06);
  --scrim:rgba(14,18,26,.28); --bar:rgba(248,249,252,.80); --sheet:rgba(246,247,250,.94);
  --red:#C62F3C; --blue:#2A5BB0; --yellow:#B98A10; --green:#1F7F48; --on-accent:#FFFFFF;
  --blob-b:#B5C8F1; --blob-y:#F2DE9F; --blob-g:#BCE2CB;
  --accent-l:#2F6BD8; --accent-d:#6E9EF2; --accent:var(--accent-l);
  --mp:#1F8F7A; --mc:#D08A12; --mf:#7B5BD6;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --spring:cubic-bezier(.32,1.25,.5,1);
  --ease:cubic-bezier(.22,.8,.24,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C0F14; --ink:#EEF1F5; --muted:#9AA4B1; --line:rgba(255,255,255,.09);
  --glass:rgba(32,37,46,.46); --glass-strong:rgba(30,35,44,.86); --glass-edge:rgba(255,255,255,.13);
  --glass-shadow:rgba(0,0,0,.50); --sheen:rgba(255,255,255,.09); --field:rgba(255,255,255,.06); --sunken:rgba(255,255,255,.06);
  --scrim:rgba(0,0,0,.45); --bar:rgba(22,26,33,.82); --sheet:rgba(20,24,31,.95);
  --red:#EE5D69; --blue:#719BE8; --yellow:#E9BD4A; --green:#57C281; --on-accent:#0C0F14;
  --blob-b:#1C3263; --blob-y:#4C3C10; --blob-g:#15442A; --accent:var(--accent-d); --mp:#33A68E; --mc:#B97C1C; --mf:#8F74E6; color-scheme:dark}}
:root[data-accent="verde"]{--accent-l:#1E8A5A; --accent-d:#4CC38A}
:root[data-accent="viola"]{--accent-l:#6B4FD6; --accent-d:#A08BF3}
:root[data-accent="arancio"]{--accent-l:#C9620E; --accent-d:#F29A4E}
:root[data-accent="grafite"]{--accent-l:#2B323C; --accent-d:#DCE2EA}
:root[data-theme="dark"]{
  --bg:#0C0F14; --ink:#EEF1F5; --muted:#9AA4B1; --line:rgba(255,255,255,.09);
  --glass:rgba(32,37,46,.46); --glass-strong:rgba(30,35,44,.86); --glass-edge:rgba(255,255,255,.13);
  --glass-shadow:rgba(0,0,0,.50); --sheen:rgba(255,255,255,.09); --field:rgba(255,255,255,.06); --sunken:rgba(255,255,255,.06);
  --scrim:rgba(0,0,0,.45); --bar:rgba(22,26,33,.82); --sheet:rgba(20,24,31,.95);
  --red:#EE5D69; --blue:#719BE8; --yellow:#E9BD4A; --green:#57C281; --on-accent:#0C0F14;
  --blob-b:#1C3263; --blob-y:#4C3C10; --blob-g:#15442A; --accent:var(--accent-d); --mp:#33A68E; --mc:#B97C1C; --mf:#8F74E6; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:pan-x pan-y}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select,.msg,.selectable{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
svg,img{-webkit-user-drag:none}
button{-webkit-appearance:none;appearance:none;margin:0}
[hidden]{display:none!important}
body{margin:0}
.glass.bar{background:linear-gradient(160deg,var(--sheen) 0%,transparent 45%),var(--bar)}
html{background:var(--bg)}
body{background:transparent;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;overscroll-behavior-y:none}
.field{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(42% 34% at 8% 6%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 72%),
    radial-gradient(46% 38% at 96% 18%, var(--blob-b), transparent 72%),
    radial-gradient(40% 32% at 88% 92%, var(--blob-y), transparent 72%),
    radial-gradient(44% 36% at 6% 84%, var(--blob-g), transparent 72%),
    var(--bg)}
.glass{background:linear-gradient(155deg,var(--sheen) 0%,transparent 42%),var(--glass);
  -webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);
  border:1px solid var(--glass-edge);box-shadow:0 12px 34px -14px var(--glass-shadow),inset 0 1px 0 var(--sheen)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:var(--glass-strong)}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--glass-strong)}
.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;border-width:0 0 1px;border-radius:0;box-shadow:0 6px 24px -18px var(--glass-shadow)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px}
.brand h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.03em;margin:0;text-transform:uppercase;display:flex;align-items:center;gap:9px;line-height:1}
.logo{width:26px;height:26px;flex:0 0 auto;border-radius:7px;box-shadow:0 4px 10px -4px var(--accent)}
.hbtns{display:flex;align-items:center;gap:8px}
.status{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--muted);height:40px;min-width:40px;padding:0 14px;border-radius:999px;white-space:nowrap}
.status i{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:0 0 auto;transition:background .3s}
.status[data-s="ok"] i{background:var(--green)}
.status[data-s="saving"] i{background:var(--yellow);animation:pulse 1s ease-in-out infinite}
.status[data-s="error"] i{background:var(--red)}
@keyframes pulse{50%{opacity:.35}}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink);cursor:pointer;padding:0;transition:transform .2s var(--spring),background .2s}
.iconbtn svg{width:20px;height:20px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.tg{flex:none;position:relative;width:51px;height:31px;border-radius:999px;border:0;padding:0;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;transition:background .25s}
.tg::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .3s var(--spring)}
.tg[aria-checked="true"]{background:var(--accent)}
.tg[aria-checked="true"]::after{transform:translateX(20px)}
.hapsw{position:fixed;left:-200px;top:0;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.iconbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.iconbtn:active{transform:scale(.9)}

/* bottom tab capsule */
nav.dock{position:fixed;z-index:9;left:0;right:0;margin-inline:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));
  width:min(480px,calc(100% - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));
  border-radius:999px;padding:6px;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
nav.dock .ind{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:999px;background:var(--glass-strong);
  box-shadow:0 4px 14px -6px var(--glass-shadow),inset 0 1px 0 var(--sheen);border:1px solid var(--glass-edge);
  transition:transform .45s var(--spring),width .45s var(--spring),opacity .25s}
nav.dock button{position:relative;z-index:1;background:none;border:0;color:var(--muted);display:grid;justify-items:center;gap:1px;padding:6px 2px 5px;border-radius:999px;cursor:pointer;font:600 10px var(--body);letter-spacing:.01em;transition:color .25s,transform .2s var(--spring);min-width:0}
nav.dock button svg{width:22px;height:22px}
nav.dock button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
nav.dock button[aria-selected="true"]{color:var(--accent)}
nav.dock button:active{transform:scale(.92)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

main{padding-block:18px calc(120px + env(safe-area-inset-bottom,0px))}
main.timer-on{padding-bottom:calc(190px + env(safe-area-inset-bottom,0px))}
section.panel{display:grid;gap:16px}
section.panel.in-r{animation:inR .32s var(--ease)}
section.panel.in-l{animation:inL .32s var(--ease)}
section.panel.in-f{animation:inF .28s var(--ease)}
@keyframes inR{from{opacity:0;transform:translateX(28px)}}
@keyframes inL{from{opacity:0;transform:translateX(-28px)}}
@keyframes inF{from{opacity:0;transform:translateY(8px)}}
h2{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05;margin:0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.15;margin:0;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{border-radius:24px;padding:18px;display:grid;gap:12px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.btn{font:600 15px var(--body);border-radius:999px;border:1px solid var(--glass-edge);background:var(--field);color:var(--ink);padding:0 20px;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.2;
  box-shadow:inset 0 1px 0 var(--sheen);transition:transform .2s var(--spring),background .2s,opacity .2s;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
@media (hover:hover){.btn:hover{background:var(--glass-strong)}.btn.ghost:hover{background:var(--sunken)}}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 55%),var(--accent);border-color:transparent;color:var(--on-accent);box-shadow:0 8px 20px -10px var(--accent),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.blue{background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 55%),var(--accent);border-color:transparent;color:var(--on-accent);box-shadow:0 8px 20px -10px var(--accent),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.ghost{background:none;border-color:transparent;box-shadow:none;color:var(--muted);-webkit-backdrop-filter:none;backdrop-filter:none}
.btn.sm{padding:0 14px;min-height:36px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default;transform:none}
a{color:var(--blue)}
label.f{display:grid;gap:5px;font-size:13px;color:var(--muted);min-width:0}
input,select,textarea{font:500 16px var(--body);color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:14px;padding:9px 12px;min-height:44px;width:100%;min-width:0;
  box-shadow:inset 0 1px 2px var(--sunken);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 22%,transparent)}
select{appearance:none;-webkit-appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat}
textarea{resize:vertical;min-height:72px;line-height:1.4}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--glass-edge);border-radius:999px;padding:0 14px;min-height:36px;font:500 13px var(--body);white-space:nowrap;background:var(--field);color:var(--ink);cursor:pointer;transition:transform .2s var(--spring),background .2s,color .2s;text-align:left}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:999px;background:var(--sunken);color:var(--muted);letter-spacing:.03em;white-space:nowrap}
.note{background:var(--sunken);border-radius:14px;padding:11px 13px;font-size:14px}
.wurow{display:flex;align-items:center;justify-content:space-between;gap:12px}.wurow .btn{flex:none}
.example{border:1px dashed var(--yellow);border-radius:14px;padding:10px 13px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.stat{border-radius:20px;padding:13px 15px;display:grid;gap:3px;align-content:start}
.stat b{font-family:var(--display);font-size:32px;font-weight:700;line-height:1}
.stat span{font-size:12px;color:var(--muted)}
.stat .key{width:22px;height:4px;border-radius:2px;margin-bottom:4px}
.week{display:flex;gap:6px}
.week div{flex:1;text-align:center;font-family:var(--mono);font-size:11px;color:var(--muted);display:grid;gap:5px;justify-items:center}
.week i{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal}
.week i.on{border-color:var(--accent);background:var(--accent);box-shadow:0 4px 10px -4px var(--accent)}
.week i.on::after{content:"";width:8px;height:5px;border:2px solid var(--on-accent);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.week i.today{border-color:var(--ink)}

/* macro bar */
.mbar{display:flex;gap:2px;height:12px;border-radius:6px;overflow:hidden}
.mbar span{display:block;border-radius:3px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
.p-c{background:var(--mp)}.c-c{background:var(--mc)}.f-c{background:var(--mf)}

/* lists */
ul.clean{list-style:none;margin:0;padding:0;display:grid;gap:9px}
ol.steps{margin:0;padding-left:0;list-style:none;counter-reset:st;display:grid;gap:9px}
ol.steps li{counter-increment:st;display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start}
ol.steps li::before{content:counter(st);width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font:600 12px var(--mono);display:grid;place-items:center;margin-top:1px}
.exrow{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.exrow:first-child{border-top:0;padding-top:0}
.seg{display:inline-flex;justify-self:start;padding:4px;border-radius:999px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{border:0;background:none;padding:0 16px;min-height:36px;white-space:nowrap;border-radius:999px;font:600 14px var(--body);color:var(--muted);cursor:pointer;transition:background .25s,color .25s,transform .2s var(--spring)}
.seg button:active{transform:scale(.96)}
.seg button[aria-pressed="true"]{background:var(--glass-strong);color:var(--ink);box-shadow:0 4px 12px -6px var(--glass-shadow),inset 0 1px 0 var(--sheen)}
.gcard .top{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:12px;align-items:center}
.gcard .top svg{width:64px;height:64px;border-radius:16px;background:var(--sunken)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid var(--glass-edge);cursor:pointer;box-shadow:0 4px 12px -6px var(--glass-shadow);transition:transform .2s var(--spring)}
.sw:active{transform:scale(.9)}
.sw[aria-pressed="true"]{border-color:var(--ink);outline:2px solid var(--glass-strong);outline-offset:-6px}
.phrow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:start}
.phimg{width:96px;height:96px;object-fit:cover;border-radius:16px;display:block}
.mlist{display:grid}
.tnum{font-variant-numeric:tabular-nums}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow.mtot{border-bottom:0;align-items:start}
.gwrap{display:flex;align-items:center;gap:6px}
.gin{width:68px;min-height:36px;padding:0 8px;text-align:right;font-family:var(--mono);border-radius:10px}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px}
.mode{border-radius:20px;padding:14px;text-align:left;display:grid;gap:2px;align-content:start;cursor:pointer;font:inherit;color:var(--ink);transition:transform .2s var(--spring),background .25s,color .25s}
.mode:active{transform:scale(.97)}
.mode strong{font:700 22px/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.mode[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent;box-shadow:0 10px 24px -12px var(--accent)}
.mode[aria-pressed="true"] .muted{color:inherit;opacity:.85}
.stepper{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.stp{display:grid;grid-template-columns:44px minmax(92px,auto) 44px;align-items:center;gap:6px}
.stp button{width:44px;height:44px;border-radius:14px;border:1px solid var(--glass-edge);background:var(--field);color:var(--ink);font:500 22px/1 var(--body);cursor:pointer;display:grid;place-items:center;transition:transform .15s var(--spring)}
.stp button:active{transform:scale(.9)}
.stp output{text-align:center;font:600 18px var(--mono);font-variant-numeric:tabular-nums}
.mixrow{display:grid;gap:10px;padding:12px;border-radius:16px;background:var(--sunken)}
.btn.big{min-height:56px;font-size:18px;width:100%}
.wod{position:fixed;inset:0;z-index:60;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;color:#fff;background:var(--wbg);--wbg:#B8690A;
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(18px,env(safe-area-inset-left,0px));
  transition:background .45s var(--ease)}
.wod{--ink:#fff;--muted:rgba(255,255,255,.6);--line:rgba(255,255,255,.28);--accent:#fff;--sunken:rgba(255,255,255,.12)}
.wfig svg{width:min(44vw,24vh);height:min(44vw,24vh);display:block;border-radius:20px;background:rgba(255,255,255,.1)}
.wlabel{text-wrap:balance;max-width:16ch}
.wod[data-phase="work"]{--wbg:#15803D}.wod[data-phase="rest"]{--wbg:#1D5FBF}.wod[data-phase="pause"]{--wbg:#3F4652}.wod[data-phase="done"]{--wbg:#151A22}
.wod.flash .wbig{animation:wpop .4s var(--spring)}
@keyframes wpop{from{transform:scale(1.07)}}
.wtop{display:flex;justify-content:space-between;align-items:center;gap:12px}
.wmode{font:700 20px/1.1 var(--display);letter-spacing:.04em;text-transform:uppercase}

/* ================= calculations ================= */
function nutr(){
  const p = state.profile, w = +p.weight, h = +p.height, a = +p.age;
  const bmr = 10*w + 6.25*h - 5*a + (p.sex === 'm' ? 5 : -161);
  const train = (+p.days * 250) / 7;
  const tdee = bmr * +p.activity + train;
  const G = GOALS[p.goal] || GOALS.ricomp;
  const bmi = w / ((h/100) ** 2);
  const refW = bmi > 30 ? 27 * (h/100) ** 2 : w;
  let kcal = Math.round(tdee * (1 + G.kcal) / 10) * 10;
  kcal = Math.max(kcal, p.sex === 'm' ? 1500 : 1200);
  const prot = Math.round(G.prot * refW);
  const fat = Math.round(Math.max(0.8 * refW, kcal * 0.25 / 9));
  const carb = Math.max(0, Math.round((kcal - prot*4 - fat*9) / 4));
  return {bmr:Math.round(bmr), tdee:Math.round(tdee), kcal, p:prot, f:fat, c:carb, bmi, refW,
    water: Math.round((w*35 + 500) / 100) / 10, fiber: Math.round(kcal / 1000 * 14)};
}
const baseId = id => state.profile.level === 'beginner' && BEGINNER_SWAP[id] ? BEGINNER_SWAP[id] : id;
const planSig = () => (state.profile.style === 'muscoli' ? 'm' : '') + Math.min(6, Math.max(2, +state.profile.days || 3));
const planKey = (di, pos) => `${planSig()}:${di}:${pos}`;
function split(){
  const d = Math.min(6, Math.max(2, +state.profile.days || 3));
  const src = state.profile.style === 'muscoli' ? MUSCLE_SPLITS : SPLITS;
  return src[d].map((day, di) => ({...day, base: day.ex.map(baseId), ex: day.ex.map((id, pos) => {
    const sw = state.swaps[planKey(di, pos)];
    return sw && EX[sw] ? sw : baseId(id);
  })}));
}
const UNIT_LONG = {rip:'ripetizioni', s:'secondi', min:'minuti'};
function presc(id){
  const G = GOALS[state.profile.goal] || GOALS.ricomp, X = EX[id];
  if(X.type === 'cardio') return {s:1, r: state.profile.goal === 'cut' ? [20,35] : [15,25], rest:0, unit:'min'};
  if(X.type === 'mob') return {s:2, r:[30,45], rest:15, unit:'s'};
  let s = G.s, r = G.r.slice(), rest = G.rest;
  if(X.type === 'iso'){ r = [Math.max(10, r[0]+2), Math.max(15, r[1]+3)]; rest = Math.min(rest, 75); s = 3; }
  if(X.type === 'core'){ r = X.timed ? [30,45] : [12,20]; rest = 60; s = 3; }
  if(X.bw && X.type === 'comp') r = [8,15];
  if(X.rr) r = X.rr.slice();
  if(state.profile.level === 'beginner') s = Math.min(s, 3);
  return {s, r, rest, unit: X.timed ? 's' : 'rip'};
}
function lastFor(id){
  for(let i = state.workouts.length - 1; i >= 0; i--){
    const e = state.workouts[i].ex.find(x => x.id === id);
    if(e && e.sets.length) return {date: state.workouts[i].date, sets: e.sets};
  }
  return null;
}
function suggest(id){
  const p = presc(id), X = EX[id], last = lastFor(id), U = UNIT_LONG[p.unit];
  if(X.type === 'cardio') return {kg:null, text: last ? `Ultima volta: ${num(last.sets[0].reps)} minuti${num(last.sets[0].kg) ? ', ' + fmt(num(last.sets[0].kg)) + ' km' : ''}. Stesso ritmo, prova ad aggiungere 2–3 minuti.` : `${p.r[0]}–${p.r[1]} minuti a un ritmo in cui riesci a parlare a frasi brevi.`};
  if(X.type === 'mob') return {kg:null, text:'Esercizio di riscaldamento: ampio e controllato, senza forzare. Lo trovi guidato con il timer in Timer → Riscaldamento.'};
  if(!last){
    if(X.bw) return {kg:null, text:`Prima volta: ${p.s} serie, cercando di arrivare a ${p.r[0]}–${p.r[1]} ${U}.`};
    if(X.timed) return {kg:null, text:`Prima volta: ${p.s} serie da ${p.r[0]}–${p.r[1]} secondi con un carico impegnativo ma gestibile.`};
    return {kg:null, text:`Prima volta: scegli un carico con cui chiudi ${p.r[1]} ripetizioni lasciandone 2–3 di margine.`};
  }
  const maxKg = Math.max(0, ...last.sets.map(s => num(s.kg)));
  const allTop = last.sets.length >= p.s && last.sets.every(s => num(s.reps) >= p.r[1]);
  const anyLow = last.sets.some(s => num(s.reps) < p.r[0]);
  if(!maxKg){
    if(allTop) return {kg:null, text: X.timed ? `Hai tenuto ${p.r[1]} secondi in tutte le serie: passa a ${p.r[1] + 15}.` : `Tutte le serie al massimo: aggiungi un piccolo carico o rallenta la discesa.`};
    return {kg:null, text:`L'ultima volta: ${last.sets.map(s => num(s.reps)).join(' · ')} ${U}. Prova a fare +1 in ogni serie.`};
  }
  if(allTop && X.inc) return {kg: maxKg + X.inc, text:`Ultima volta hai chiuso tutte le serie a ${p.r[1]}: sali a ${fmt(maxKg + X.inc)} kg.`};
  if(anyLow) return {kg: maxKg, text:`Alcune serie sotto ${p.r[0]} ${U}: resta a ${fmt(maxKg)} kg e cura la tecnica.`};
  return {kg: maxKg, text:`Resta a ${fmt(maxKg)} kg e prova ad aggiungere 1 ripetizione per serie.`};
}
const e1rm = (kg, r) => kg * (1 + r / 30);
function nextDayIdx(){
  const n = split().length, sig = planSig();
  for(let i = state.workouts.length - 1; i >= 0; i--){
    const w = state.workouts[i];
    if(typeof w.dayIdx !== 'number') continue; // muscle-group sessions don't move the rotation
    if(w.plan && w.plan !== sig) return 0;
    return w.dayIdx >= 0 && w.dayIdx < n ? (w.dayIdx + 1) % n : 0;
  }
  return 0;
}
function resolveDay(ref){
  if(typeof ref === 'string' && ref.startsWith('g:')){ const g = GW(ref.slice(2)); return {day:{n:g.n, ex:g.ex.map(baseId)}, dayIdx:null}; }
  const i = +ref, sp = split(); return {day: sp[i] || sp[0], dayIdx: sp[i] ? i : 0};
}
const estMin = ex => Math.round((8 + ex.reduce((a, id) => { const p = presc(id); return a + (p.unit === 'min' ? p.r[0] : p.s * ((p.unit === 's' ? p.r[1] : 40) + p.rest) / 60); }, 0)) / 5) * 5;
function weekDates(){ const d = new Date(); const dow = (d.getDay() + 6) % 7; const mon = new Date(d.getFullYear(), d.getMonth(), d.getDate() - dow); return [...Array(7)].map((_, i) => iso(new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i))); }
function sortedWeights(){ return state.weights.slice().sort((a, b) => a.date.localeCompare(b.date)); }
function weeklyRate(){
  const w = sortedWeights(); if(w.length < 2) return null;
  const last = w[w.length-1], first = w.find(x => dayNum(last.date) - dayNum(x.date) <= 28) || w[0];
  const days = dayNum(last.date) - dayNum(first.date); if(days < 10) return null;
  return {kgWk: (last.kg - first.kg) / days * 7, pct: (last.kg - first.kg) / first.kg / days * 7 * 100};
}
function syncProfileWeight(){ const l = sortedWeights().pop(); if(l) state.profile.weight = l.kg; }

/* ================= coaching tips ================= */
function tips(){
  const out = [], p = state.profile, n = nutr();
  const last = state.workouts[state.workouts.length - 1], today = dayNum(iso());
  if(!last) out.push({c:'var(--blue)', t:'Prime 2 settimane: carichi leggeri e attenzione alla tecnica. Tocca un esercizio per vedere come si esegue.'});
  else {
    const gap = today - dayNum(last.date);
    if(gap >= 4) out.push({c:'var(--red)', t:`Sono passati ${gap} giorni dall'ultimo allenamento. Non serve recuperare: riparti dalla prossima seduta.`});
  }
  const done = new Set(state.workouts.filter(w => weekDates().includes(w.date)).map(w => w.date)).size;
  if(done >= +p.days) out.push({c:'var(--green)', t:`Obiettivo settimanale raggiunto (${done}/${p.days}). Anche il riposo fa crescere i muscoli.`});

(() => {

  const move = (y, ev) => {

    dy = y - y0;

const tabScroll = {};
function showTab(t, opts = {}){
  if(!TABS.includes(t)) return;

  if(prev === t && opts.scroll !== false && opts.animate !== false){ window.scrollTo({top:0, behavior: reduce ? 'auto' : 'smooth'}); return; }

  $('#hCoach').setAttribute('aria-pressed', t === 'coach'); $('#hProfilo').setAttribute('aria-pressed', t === 'profilo');

let tEnd = 0, tTotal = 0, tInt = null, actx = null;
const RING = 2 * Math.PI * 19;
function audio(){ try{ actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if(actx.state === 'suspended') actx.resume(); }catch(e){ actx = null; } }
function beep(){ if(!actx || !state.settings.sound) return; try{ [0, .22, .44].forEach(d => { const o = actx.createOscillator(), g = actx.createGain(); o.type = 'sine'; o.frequency.value = d > .4 ? 1175 : 880; g.gain.setValueAtTime(.0001, actx.currentTime + d); g.gain.exponentialRampToValueAtTime(.25, actx.currentTime + d + .02); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + d + .18); o.connect(g).connect(actx.destination); o.start(actx.currentTime + d); o.stop(actx.currentTime + d + .2); }); }catch(e){} }
function startTimer(sec){
  audio();
  tTotal = sec; tEnd = Date.now() + sec * 1000;
  const t = $('#timer');
  if(t.hidden){ t.hidden = false; t.classList.add('enter'); void t.offsetWidth; t.classList.remove('enter'); }
  t.style.transform = ''; $('#main').classList.add('timer-on');
  clearInterval(tInt); tick(); tInt = setInterval(tick, 200);
}
function tick(){
  const ms = Math.max(0, tEnd - Date.now()), left = Math.ceil(ms / 1000);
  $('#tLeft').textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
  $('#tRing').setAttribute('stroke-dashoffset', (RING * (1 - ms / (tTotal * 1000))).toFixed(2));
  if(ms <= 0){ beep(); haptic([200, 100, 200]); toast('Recupero finito: prossima serie'); stopTimer(); }
}
function stopTimer(){
  clearInterval(tInt); tInt = null;
  const t = $('#timer'); if(t.hidden) return;
  t.classList.add('enter');
  setTimeout(() => { if(!tInt){ t.hidden = true; t.classList.remove('enter'); t.style.transform = ''; $('#main').classList.remove('timer-on'); } }, reduce ? 0 : 300);
}
$('#tPlus').onclick = () => { tEnd += 15000; tTotal += 15; tick(); haptic(5); };
$('#tMinus').onclick = () => { tEnd -= 15000; tTotal = Math.max(1, tTotal - 15); tick(); haptic(5); };
$('#tSkip').onclick = () => { stopTimer(); haptic(5); };
(() => { // swipe the timer pill sideways or down to skip
  const t = $('#timer'); let x0 = null, y0 = 0;
  t.addEventListener('touchstart', e => { if(e.target.closest('button')) return; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t.style.transition = 'none'; }, {passive:true});
  t.addEventListener('touchmove', e => { if(x0 === null) return; const dx = e.touches[0].clientX - x0, dy = Math.max(0, e.touches[0].clientY - y0); t.style.transform = `translate(${Math.round(dx)}px, ${Math.round(dy)}px)`; t.style.opacity = String(Math.max(.3, 1 - Math.max(Math.abs(dx), dy) / 220)); }, {passive:true});
  t.addEventListener('touchend', e => {
    if(x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    t.style.transition = ''; t.style.opacity = '';
    if(Math.abs(dx) > 90 || dy > 60){ haptic(6); stopTimer(); } else t.style.transform = '';
  });
})();

let sampleFn;
async function getSample(){ if(sampleFn !== undefined) return sampleFn; try{ sampleFn = window.claude && window.claude.use ? await window.claude.use('sample') : null; }catch(e){ sampleFn = null; } return sampleFn; }
const AI_MODEL = 'claude-opus-5-5';
const SDK_URL = 'https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.131.0/+esm';
const KEY_LS = 'ghisa-anthropic-key';
const getKey = () => { try{ return localStorage.getItem(KEY_LS) || ''; }catch(e){ return ''; } };
const setKey = k => { try{ if(k) localStorage.setItem(KEY_LS, k); else localStorage.removeItem(KEY_LS); }catch(e){} };
let sdkMod = null;
async function apiClient(){
  if(!sdkMod) sdkMod = (await import(SDK_URL)).default;
  return new sdkMod({apiKey: getKey(), dangerouslyAllowBrowser: true, maxRetries: 2});
}
async function aiSource(force){
  if(force !== 'api'){ const s = await getSample(); if(s) return {kind:'claude', sample:s}; }
  return getKey() ? {kind:'api'} : null;
}
function apiErr(e){
  if(e && typeof e.code === 'string' && !(e instanceof Error)) return e;
  const A = sdkMod || {};
  if(A.APIUserAbortError && e instanceof A.APIUserAbortError) return {code:'cancelled'};
  if((A.AuthenticationError && e instanceof A.AuthenticationError) || (A.PermissionDeniedError && e instanceof A.PermissionDeniedError)) return {code:'bad_key'};
  if(A.RateLimitError && e instanceof A.RateLimitError) return {code:'rate_limited'};
  if(A.APIConnectionError && e instanceof A.APIConnectionError) return {code:'network'};
  if(A.BadRequestError && e instanceof A.BadRequestError) return {code:'invalid_request'};
  if(A.APIError && e instanceof A.APIError) return {code:'upstream_error'};
  if(e && e.name === 'AbortError') return {code:'cancelled'};
  if(e instanceof TypeError) return {code:'network'}; // the SDK could not be downloaded
  return {code:'upstream_error'};
}
// server-side fallback: if the model declines, the API re-runs the request on Anthropic's recommended model
const API_BASE = {model: AI_MODEL, betas: ['server-side-fallback-2026-07-01'], fallbacks: 'default'};
function mergeTurns(turns){
  const out = [];
  turns.forEach(t => { const last = out[out.length - 1]; if(last && last.role === t.role) last.content += '\n\n' + t.content; else out.push({role:t.role, content:String(t.content)}); });
  while(out.length && out[0].role !== 'user') out.shift();
  return out;
}
const textOf = msg => msg.content.filter(b => b.type === 'text').map(b => b.text).join('');
async function aiText({system, turns, effort = 'low', signal, onText, force}){
  const src = await aiSource(force); if(!src) throw {code:'no_ai'};
  if(src.kind === 'claude'){ const {text} = await src.sample([{role:'user', content:system}, ...turns], {cache:false, signal, onText}); return text; }
  try{
    const client = await apiClient();
    const stream = client.beta.messages.stream({...API_BASE, max_tokens:16000, output_config:{effort}, system, messages: mergeTurns(turns)});
    if(signal) signal.addEventListener('abort', () => stream.abort(), {once:true});
    let text = '';
    stream.on('text', d => { text += d; onText && onText({text}); });
    const msg = await stream.finalMessage();
    if(msg.stop_reason === 'refusal') throw {code:'refused'};
    return textOf(msg);
  }catch(e){ throw apiErr(e); }
}
async function aiJSON({prompt, schema, images = [], effort = 'medium'}){
  const src = await aiSource(); if(!src) throw {code:'no_ai'};
  if(src.kind === 'claude'){
    if(images.length){ const lim = await src.sample.limits().catch(() => null); if(!lim || !lim.images) throw {code:'images_unavailable'}; }
    return src.sample.json(prompt + '\n\nRispondi solo con un oggetto JSON che rispetta questo schema: ' + JSON.stringify(schema),
      {modelTier:'default', cache:false, ...(images.length ? {images: images.map(i => i.blob)} : {})});
  }
  try{
    const client = await apiClient();
    const content = [...images.map(i => ({type:'image', source:{type:'base64', media_type:i.type, data:i.b64}})), {type:'text', text:prompt}];
    const msg = await client.beta.messages.create({...API_BASE, max_tokens:16000, output_config:{effort, format:{type:'json_schema', schema}}, messages:[{role:'user', content}]});
    if(msg.stop_reason === 'refusal') throw {code:'refused'};
    if(msg.stop_reason === 'max_tokens') throw {code:'invalid_json'};
    return JSON.parse(textOf(msg));
  }catch(e){ if(e instanceof SyntaxError) throw {code:'invalid_json'}; throw apiErr(e); }
}

const mealNow = () => { const h = new Date().getHours(); return h < 11 ? 'Colazione' : h < 15 ? 'Pranzo' : h < 18.5 ? 'Spuntino' : 'Cena'; };
const foodToday = () => state.food.filter(f => f.date === iso());
const foodTot = list => list.reduce((a, f) => ({kcal:a.kcal + num(f.kcal), p:a.p + num(f.p), c:a.c + num(f.c), f:a.f + num(f.f)}), {kcal:0, p:0, c:0, f:0});
function markFood(date){ if(!state.foodDirty.includes(date)) state.foodDirty.push(date); persist(); }
function addFood(entry){
  state.food.push({id: uidGen(), ts: Date.now(), date: iso(), ...entry});
  const cut = dayNum(iso()) - 120; state.food = state.food.filter(f => dayNum(f.date) >= cut);
  markFood(iso());
}

function parseMeal(text){
  const JOINED = FOODS.flatMap(fd => fd.al).filter(a => / (con|e) /.test(a)).map(strip).sort((a, b) => b.length - a.length); // dishes whose name contains "con"/"e"
  const parts = text.split(/[,;+\n]+/).map(strip).filter(Boolean).flatMap(p => {
    JOINED.forEach(a => { p = p.split(a).join(a.replace(/ /g, 'qqq')); }); // protect them while splitting on "e"/"con"
    return p.replace(/\b(ed?|piu|con|insieme a|poi)\b/g, ',').split(',').map(x => x.replace(/qqq/g, ' ').trim()).filter(Boolean);
  });
  return parts.map(raw => {
    let s = ' ' + raw + ' ', qty = null, unit = null;
    // number + optional unit, anywhere in the piece (e.g. "80 g di pasta", "pasta 80g", "2 uova", "mezzo litro di latte")
    const m = s.match(/\s(\d+\/\d+|\d+(?:[.,]\d+)?|(?:una|uno|un|mezza|mezzo|due|tre|quattro|cinque|sei|sette|otto|nove|dieci|dodici|venti|qualche|paio)(?=\s))\s*([a-z]+)?(?=\s)/);
    if(m){
      const n = m[1];
      qty = /\//.test(n) ? (+n.split('/')[0] / +n.split('/')[1]) : NUMW[n] !== undefined ? NUMW[n] : parseFloat(n.replace(',', '.'));
      if(!(qty > 0)) qty = null;
      const uw = m[2] || ''; const hit = UNITS.find(([re]) => re.test(uw));
      if(hit) unit = hit[1];
      s = s.replace(m[0], hit ? ' ' : ' ' + uw + ' ');
    }
    const st = stems(s);
    let found = null;
    for(const e of FOOD_IDX){
      for(let i = 0; i + e.st.length <= st.length; i++){
        if(e.st.every((w, j) => st[i + j] === w)){ found = e.fd; break; }
      }
      if(found) break;
    }
    if(!found) return {raw, unknown:true};
    // cooked / raw hints switch to the matching variant
    if(/\bcott[aoie]\b|\blessat|\bbollit/.test(raw) && FOODS.find(x => x.id === found.id + '_cotto' || x.id === found.id + '_cotta')) found = FOODS.find(x => x.id === found.id + '_cotto' || x.id === found.id + '_cotta');
    let g, how;
    if(qty !== null && unit){
      g = unit === 'kg' ? qty * 1000 : unit === 'hg' ? qty * 100 : unit === 'l' ? qty * 1000 : unit === 'cl' ? qty * 10 : unit === 'g' ? qty : qty * (found.u[unit] || GENERIC_UNIT[unit] || found.def);
      how = unit === 'g' || unit === 'kg' || unit === 'hg' || unit === 'l' || unit === 'cl' ? 'peso indicato' : 'misura casalinga';
    } else if(qty !== null){
      if(found.u.pz && qty < 20){ g = qty * found.u.pz; how = 'pezzo medio'; }
      else if(qty >= 20){ g = qty; how = 'peso indicato'; }
      else { g = qty * found.def; how = 'porzione standard'; }
    } else { g = found.def; how = 'porzione standard'; }
    if(found.raw && how === 'peso indicato' && g <= 150){ g = g * found.def / found.raw; how = 'pasta cruda'; } // "80 g di pasta al pomodoro" = 80 g of dry pasta, dressed
    return {raw, fd: found, g: Math.round(g * 10) / 10, how};
  });
}
const foodVals = (fd, g) => ({kcal: fd.k * g / 100, p: fd.p * g / 100, c: fd.c * g / 100, f: fd.f * g / 100});

}

}

function enterSeg(){

  const lastWork = s.k === 'work' && !W.segs.slice(W.i + 1).some(x => x.k === 'work');
  tone(s.k === 'rest' ? 660 : 1046, .45);
  haptic(s.k === 'rest' ? [60] : [120]);
  if(W.c.mode === 'circuit' || W.c.mode === 'warmup'){
    if(s.k === 'prep') say('Preparati. Si parte con ' + EX[s.nextEx].n);
    else if(s.k === 'rest') say((W.c.mode === 'warmup' ? '' : s.label === 'Riposo tra i giri' ? 'Riposo tra i giri. ' : 'Riposo. ') + 'Prossimo: ' + EX[s.nextEx].n);
    else say((lastWork ? 'Ultimo esercizio: ' : '') + EX[s.ex].n);
  }
  else if(s.k === 'prep') say('Preparati');
  else if(s.k === 'rest') say(s.label === 'Riposo tra le serie' ? 'Riposo tra le serie' : 'Riposo');
  else if(W.i === W.segs.findIndex(x => x.k === 'work')) say('Via!');

function wodTick(){
  if(!W || W.paused || W.done) return;
  let s = W.segs[W.i], el = (clk() - W.segStart) / 1000;
  while(el >= s.dur){ // also catches up after the phone was locked
    W.segStart += s.dur * 1000; W.i++;
    if(W.i >= W.segs.length){ wodFinish(W.c.mode === 'fortime' ? 'cap' : 'done'); return; }
    s = W.segs[W.i]; enterSeg(); el = (clk() - W.segStart) / 1000;
  }
  if(!isFinite(s.dur)) return;
  const rem = s.dur - el, sec = Math.ceil(rem);
  if(sec <= 3 && sec >= 1 && W.cue !== W.i + ':' + sec){ W.cue = W.i + ':' + sec; tone(880, .16); haptic(30); }
  if(s.k === 'work' && s.half && !W.flags.side && el >= s.dur / 2){ W.flags.side = 1; say(s.half); tone(880, .2); haptic(40); }
  if(s.k === 'work' && s.dur >= 120 && !W.flags.half && el >= s.dur / 2){ W.flags.half = 1; say('Metà tempo'); }
  if(s.k === 'work' && s.dur >= 180 && !W.flags.last && rem <= 60){ W.flags.last = 1; say('Ultimo minuto'); }
  if(s.k === 'rest' && s.dur >= 15 && !W.flags.ready && rem <= 5.5){ W.flags.ready = 1; say('Pronti'); }
}
function wodFrame(){
  if(!W || W.done) return;
  const s = W.segs[W.i], el = Math.max(0, (clk() - W.segStart) / 1000);
  const big = s.up ? Math.floor(el) : Math.ceil(Math.max(0, s.dur - el));
  const bigTxt = s.k === 'prep' ? String(big) : mmss(big);
  const B = $('#wBig'); if(B && B.textContent !== bigTxt){ B.textContent = bigTxt; B.classList.toggle('long', bigTxt.length > 5); }
  const P = $('#wProg'); if(P) P.style.transform = `scaleX(${isFinite(s.dur) ? Math.min(1, el / s.dur) : 0})`;
  const T = $('#wTot'); if(T){ const w = W.workStart === null ? 0 : (clk() - W.workStart) / 1000, all = workDur(W.segs); T.textContent = W.c.mode === 'fortime' ? (s.k === 'prep' ? 'Si parte tra poco' : (isFinite(s.dur) ? 'Limite ' + mmss(s.dur) : 'Nessun limite')) : `Trascorso ${mmss(w)} · mancano ${mmss(Math.max(0, all - w))}`; }
  requestAnimationFrame(wodFrame);
}
function wodLayout(){
  if(!W) return;
  const s = W.segs[W.i], next = W.segs[W.i + 1], cnt = roundsCounting(W.c.mode) && s.k === 'work';
  $('#wLabel').textContent = W.paused ? 'In pausa' : s.label;
  const seq = W.c.mode === 'circuit' || W.c.mode === 'warmup';
  $('#wRound').textContent = seq
    ? (s.k === 'work' ? `Esercizio ${s.st}/${s.sts}` + (s.r ? ` · Giro ${s.r}/${s.rt}` : '') : s.nextEx ? `Prossimo: ${EX[s.nextEx].n}` : '')
    : [s.set && s.sets > 1 ? `Serie ${s.set}/${s.sets}` : '', s.r ? `Round ${s.r}/${s.rt}` : ''].filter(Boolean).join(' · ');
  const figId = s.ex || s.nextEx || null, fig = $('#wFig');
  if(fig.dataset.id !== String(figId)){ fig.dataset.id = String(figId); fig.hidden = !figId; fig.innerHTML = figId ? figSVG(figId) : ''; if(figId) hookFigs(fig); }
  const nextWork = W.segs.slice(W.i + 1).find(x => x.k === 'work');
  $('#wNext').textContent = seq && s.k !== 'work' ? '' : W.c.mode === 'warmup' ? (nextWork ? 'Dopo: ' + nextWork.label : 'Ultimo esercizio') : next ? `Dopo: ${next.label}${isFinite(next.dur) ? ' ' + mmss(next.dur) : ''}` : 'Ultimo blocco';
  $('#wRounds').hidden = !roundsCounting(W.c.mode);
  $('#wRounds').innerHTML = `<b class="num">${W.splits.length}</b><span>${W.splits.length === 1 ? 'giro' : 'giri'}${W.splits.length ? ' · ultimo ' + mmss((W.splits[W.splits.length - 1] - (W.splits[W.splits.length - 2] || 0)) / 1000) : ''}</span>`;
  $('#wLap').hidden = !cnt; $('#wUndo').hidden = !cnt || !W.splits.length;
  $('#wDone').hidden = !(W.c.mode === 'fortime' && s.k === 'work');
  $('#wPause').textContent = W.paused ? 'Riprendi' : 'Pausa';
  $('#wod').dataset.phase = W.paused ? 'pause' : s.k;
}

function wodPause(){
  if(!W || W.done) return;
  if(W.paused){ W.pausedTotal += performance.now() - W.pauseAt; W.paused = false; say('Si riparte'); }
  else { W.paused = true; W.pauseAt = performance.now(); try{ speechSynthesis.cancel(); }catch(e){} }
  haptic(10); wodLayout();
}
function wodFinish(reason){
  if(!W || W.done) return;
  W.done = true; clearInterval(W.int);
  const s = W.segs[W.i] || W.segs[W.segs.length - 1];
  const worked = W.workStart === null ? 0 : (clk() - W.workStart) / 1000;
  const total = reason === 'cap' ? s.dur : reason === 'done' ? workDur(W.segs) : worked;
  [0, .2, .4].forEach((t, i) => tone(i === 2 ? 1568 : 1046, .25, t));
  haptic([150, 80, 150]);
  say(reason === 'cap' ? 'Tempo scaduto' : reason === 'stop' ? 'Timer fermato' : W.c.mode === 'warmup' ? 'Riscaldamento finito. Ora si parte!' : 'Finito! Ottimo lavoro');
  W.result = {total: Math.round(total), splits: W.splits.map(x => Math.round(x / 1000)), reason};
  if(W.c.mode === 'warmup'){
    const after = W.after, act = !!state.active;
    $('#wod').dataset.phase = 'done';
    $('#wod').innerHTML = `
    <div class="wtop"><div class="wmode">${esc(wodSummaryLabel(W.c))}</div></div>
    <div class="wmid"><div class="wlabel">${reason === 'stop' ? 'Riscaldamento interrotto' : 'Sei pronto!'}</div>
      <div class="wbig num">${mmss(W.result.total)}</div>
      <div class="wsmall">Prima delle serie vere fai 1–2 serie leggere del primo esercizio: metà carico, poi circa il 70%.</div></div>
    <div class="wctl"><button class="wbtn ghost" id="wDiscard">Chiudi</button>${act || after != null ? `<button class="wbtn strong" id="wAfter">${act ? "Torna all'allenamento" : 'Inizia allenamento'}</button>` : ''}</div>`;
    $('#wDiscard').onclick = closeWod;
    const a = $('#wAfter'); if(a) a.onclick = () => { closeWod(); showTab('oggi'); if(!state.active) startSession(after); };
    return;
  }
  const sp = W.result.splits;
  $('#wod').dataset.phase = 'done';
  $('#wod').innerHTML = `
    <div class="wtop"><div class="wmode">${esc(wodSummaryLabel(W.c))}</div></div>
    <div class="wmid"><div class="wlabel">${reason === 'cap' ? 'Tempo scaduto' : reason === 'stop' ? 'Fermato' : 'Finito!'}</div>
      <div class="wbig num">${mmss(W.result.total)}</div>
      ${sp.length ? `<div class="wrounds"><b class="num">${sp.length}</b><span>${sp.length === 1 ? 'giro' : 'giri'}</span></div>
      <div class="wsplits">${sp.map((t, i) => `<span class="num">Giro ${i + 1} · ${mmss(t - (sp[i - 1] || 0))}</span>`).join('')}</div>` : ''}</div>
    <div class="wctl"><button class="wbtn ghost" id="wDiscard">Esci senza salvare</button><button class="wbtn strong" id="wSave">Salva</button></div>`;
  $('#wSave').onclick = () => {
    state.wods.unshift({id: uidGen(), ts: Date.now(), date: W.date, mode: W.c.mode, label: wodSummaryLabel(W.c), total: W.result.total, rounds: sp.length, splits: sp.slice(0, 60)});
    state.wods = state.wods.slice(0, 100); persist(); closeWod(); toast('Salvato nello storico'); renderTimer(); renderProgressi();
  };
  $('#wDiscard').onclick = closeWod;
}
function closeWod(){
  const ov = $('#wod'); ov.hidden = true; ov.innerHTML = ''; document.documentElement.style.overflow = '';
  try{ speechSynthesis.cancel(); }catch(e){}
  if(!state.active) lockScreen(false);
  try{ if(document.fullscreenElement) document.exitFullscreen().catch(() => {}); }catch(e){}
  W = null;
}

function askDelete(btn, fn, label = 'Elimina'){ // second tap within 3 s confirms

let chartData = null, chartRO = null;
function weightChart(w){
  if(w.length < 2){ chartData = null; return `<div class="note small">Aggiungi almeno due pesate per vedere il grafico. Pesati al mattino, dopo il bagno e prima di colazione.</div>`; }
  return `<div class="chartbox" id="chartBox" style="min-height:200px"></div>
  <div class="legend small muted"><span><i class="dot" style="background:var(--muted);border-radius:50%"></i>Pesate singole</span><span><i class="dot" style="background:var(--accent);height:3px;width:14px;border-radius:2px"></i>Media degli ultimi 7 giorni (quella che conta)</span></div>`;
}
function chartSVG(w, W){
  const H = W < 480 ? 200 : 230, L = 36, R = 14, T = 14, B = 26;
  const d0 = dayNum(w[0].date), d1 = dayNum(w[w.length-1].date);
  const avg = w.map(x => { const d = dayNum(x.date); const win = w.filter(y => { const u = dayNum(y.date); return u <= d && u > d - 7; }); return {date:x.date, kg:x.kg, avg: win.reduce((a, y) => a + y.kg, 0) / win.length}; });
  const ks = w.map(x => x.kg), lo = Math.floor(Math.min(...ks) - .5), hi = Math.ceil(Math.max(...ks) + .5);
  const X = d => L + (dayNum(d) - d0) / Math.max(1, d1 - d0) * (W - L - R), Y = k => T + (hi - k) / Math.max(1, hi - lo) * (H - T - B);
  const step = Math.max(1, Math.ceil((hi - lo) / 4));
  let grid = ''; for(let k = lo; k <= hi; k += step) grid += `<line x1="${L}" x2="${W-R}" y1="${Y(k).toFixed(1)}" y2="${Y(k).toFixed(1)}" stroke="var(--line)"/><text x="${L-6}" y="${(Y(k)+3).toFixed(1)}" text-anchor="end">${k}</text>`;
  const line = avg.map(a => `${X(a.date).toFixed(1)},${Y(a.avg).toFixed(1)}`).join(' ');
  const area = `M${X(avg[0].date).toFixed(1)},${H-B} L${line.replace(/ /g, ' L')} L${X(avg[avg.length-1].date).toFixed(1)},${H-B} Z`;
  const last = avg[avg.length-1];
  chartData = {pts: avg.map(a => ({...a, x:X(a.date), y:Y(a.kg), ya:Y(a.avg)})), W, H, T, B};
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Andamento del peso dal ${dItal(w[0].date)} al ${dItal(w[w.length-1].date)}: da ${fmt(w[0].kg)} a ${fmt(last.kg)} kg">
    ${grid}
    <path d="${area}" fill="var(--accent)" opacity=".12"/>
    <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${chartData.pts.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="var(--muted)" opacity=".7"/>`).join('')}
    <circle cx="${X(last.date).toFixed(1)}" cy="${Y(last.avg).toFixed(1)}" r="5" fill="var(--accent)" stroke="var(--glass-strong)" stroke-width="2"/>
    <line id="cross" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-dasharray="3 3" opacity="0"/>
    <circle id="crossDot" r="5" fill="var(--accent)" stroke="var(--glass-strong)" stroke-width="2" opacity="0"/>
    <text x="${L}" y="${H-8}">${dItal(w[0].date)}</text><text x="${W-R}" y="${H-8}" text-anchor="end">${dItal(w[w.length-1].date)}</text>
    <rect id="hit" x="${L}" y="0" width="${W-L-R}" height="${H}" fill="transparent" tabindex="0" aria-label="Esplora i valori del grafico con le frecce"/>
  </svg><div class="tip glass bar" id="cTip"></div>`;
}
function bindChart(root){
  const box = root.querySelector('#chartBox'); if(!box) return;
  const w = sortedWeights();
  let drawnW = 0;
  const draw = () => {
    const W = Math.round(box.clientWidth); if(!W || W === drawnW) return;
    drawnW = W; box.style.minHeight = ''; box.innerHTML = chartSVG(w, W); wireChart(box);
  };
  if(chartRO) chartRO.disconnect();
  chartRO = 'ResizeObserver' in window ? new ResizeObserver(draw) : null;
  if(chartRO) chartRO.observe(box); else { window.addEventListener('resize', draw); }
  draw();
}
function wireChart(box){
  const svg = box.querySelector('svg'), hit = svg.querySelector('#hit'), cross = svg.querySelector('#cross'), dot = svg.querySelector('#crossDot'), tip = box.querySelector('#cTip');
  let cur = -1;
  const show = i => {
    cur = Math.max(0, Math.min(chartData.pts.length - 1, i));
    const p = chartData.pts[cur], r = svg.getBoundingClientRect(), sx = r.width / chartData.W;
    cross.setAttribute('x1', p.x); cross.setAttribute('x2', p.x); cross.setAttribute('opacity', '.8');
    dot.setAttribute('cx', p.x); dot.setAttribute('cy', p.ya); dot.setAttribute('opacity', '1');
    tip.textContent = '';
    const s = document.createElement('strong'); s.textContent = fmt(p.kg) + ' kg'; tip.append(s);
    const d = document.createElement('div'); d.className = 'muted'; d.textContent = 'Pesata del ' + dItal(p.date); tip.append(d);
    const a = document.createElement('div'); const k = document.createElement('i'); k.className = 'k'; a.append(k, 'media 7 gg: ' + fmt(p.avg) + ' kg'); tip.append(a);
    tip.classList.add('on');
    const tw = tip.offsetWidth, x = Math.min(Math.max(p.x * sx, tw / 2 + 2), r.width - tw / 2 - 2);
    tip.style.left = Math.round(x - tw / 2) + 'px'; tip.style.top = Math.round(Math.max(0, p.y * sx - tip.offsetHeight - 14)) + 'px';
  };
  const hide = () => { cross.setAttribute('opacity', '0'); dot.setAttribute('opacity', '0'); tip.classList.remove('on'); cur = -1; };
  const nearest = clientX => { const r = svg.getBoundingClientRect(), x = (clientX - r.left) / r.width * chartData.W; let bi = 0, bd = Infinity; chartData.pts.forEach((p, i) => { const d = Math.abs(p.x - x); if(d < bd){ bd = d; bi = i; } }); return bi; };
  hit.addEventListener('pointermove', e => show(nearest(e.clientX)));
  hit.addEventListener('pointerdown', e => show(nearest(e.clientX)));
  hit.addEventListener('pointerleave', hide);
  hit.addEventListener('focus', () => show(chartData.pts.length - 1));
  hit.addEventListener('blur', hide);
  hit.addEventListener('keydown', e => { if(e.key === 'ArrowLeft'){ e.preventDefault(); show(cur - 1); } if(e.key === 'ArrowRight'){ e.preventDefault(); show(cur + 1); } });
}

/* ================= COACH ================= */
let chatCtl = null, chatBusy = false;
function context(){
  const p = state.profile, n = nutr(), sp = split();
  const recent = state.workouts.slice(-6).map(w => `${w.date} ${w.n}: ` + w.ex.map(e => (EX[e.id] ? EX[e.id].n : e.id) + ' ' + e.sets.map(s => (num(s.kg) ? num(s.kg) + 'kg×' : '') + num(s.reps)).join(', ')).join('; ')).join('\n');
  const wts = sortedWeights().slice(-10).map(x => `${x.date} ${x.kg}kg${x.waist ? ' vita ' + x.waist + 'cm' : ''}`).join(', ');
  return `DATI DELL'UTENTE
Profilo: ${p.sex === 'm' ? 'uomo' : 'donna'}, ${p.age} anni, ${p.height} cm, ${p.weight} kg, livello ${LEVELS[p.level]}, obiettivo: ${GOALS[p.goal].l}, ${p.days} allenamenti a settimana (scheda ${STYLES[p.style || 'auto'].toLowerCase()}), attività quotidiana: ${ACT[p.activity]}.${p.example ? ' (Attenzione: sono ancora i valori di esempio, l\'utente non ha inserito i suoi dati: ricordaglielo se serve.)' : ''}
Target nutrizionali: ${n.kcal} kcal, proteine ${n.p} g, carboidrati ${n.c} g, grassi ${n.f} g.
Scheda: ${sp.map(d => d.n + ' = ' + d.ex.map(id => EX[id].n).join(', ')).join(' | ')}
Ultimi allenamenti:
${recent || 'nessuno ancora'}
Pesate: ${wts || 'nessuna'}
Oggi è ${iso()}.`;
}
const RULES = () => `Sei il coach di "Ghisa", un'app per chi va in palestra. Sei un personal trainer e nutrizionista sportivo esperto e parli in italiano, in modo diretto e incoraggiante, come un amico competente.
Regole: risposte brevi e pratiche (massimo 180 parole), elenchi puntati con "-" quando servono, niente tabelle né titoli con #. Basati sui dati dell'utente qui sotto. Se spieghi un esercizio, dai posizione di partenza, esecuzione, respirazione ed errori comuni. Non fare diagnosi: per dolore acuto, persistente o sintomi strani consiglia medico o fisioterapista. Niente farmaci, niente diete estreme.

${context()}`;
const QUICK = ['Com\'è andata la mia ultima settimana?', 'Cosa mangio prima e dopo l\'allenamento?', 'Mi spieghi l\'hip thrust passo per passo?', 'Sento fastidio al ginocchio nello squat, cosa cambio?', 'Ho solo 30 minuti oggi: come accorcio la seduta?'];
function fmtMsg(t){ return esc(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/^#+\s*/gm, ''); }
function renderCoach(){
  const el = $('#p-coach');
  if(chatBusy) return; // never wipe a reply while it is being written
  el.innerHTML = `
    <div><span class="eyebrow">Conosce la tua scheda, i tuoi pasti e i tuoi progressi</span><h2>Chiedi al coach</h2></div>
    <div class="card glass">
      <div class="chat" id="chatBox" aria-live="polite">${state.chat.length ? state.chat.map(m => `<div class="msg ${m.role === 'user' ? 'u' : 'a'}">${fmtMsg(m.content)}</div>`).join('') : `<div class="msg a">Ciao! Chiedimi qualsiasi cosa: come si fa un esercizio, cosa mangiare, come superare uno stallo. Vedo la tua scheda e i tuoi allenamenti.</div>`}</div>
      <div class="chiprow" id="quick">${QUICK.map(q => `<button class="chip" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>
      <form id="chatForm" style="display:grid;gap:8px">
        <label class="f" for="chatIn">La tua domanda</label>
        <textarea id="chatIn" rows="2" placeholder="Es. Come si fa il rematore con manubrio?"></textarea>
        <div class="row"><button class="btn primary" type="submit" id="chatSend">Invia</button><button class="btn sm" type="button" id="chatStop" hidden>Ferma</button>${state.chat.length ? `<button class="btn ghost sm" type="button" id="chatClear">Nuova conversazione</button>` : ''}</div>
        <p class="small muted" id="chatNote" aria-live="polite"></p>
      </form>
    </div>`;
  $('#quick').onclick = e => { const c = e.target.closest('[data-q]'); if(c){ $('#chatIn').value = c.dataset.q; ask(); } };
  $('#chatForm').onsubmit = e => { e.preventDefault(); ask(); };
  $('#chatIn').onkeydown = e => { if(e.key === 'Enter' && !e.shiftKey && !e.isComposing && matchMedia('(hover:hover)').matches){ e.preventDefault(); ask(); } };
  $('#chatStop').onclick = () => chatCtl && chatCtl.abort();
  const clr = $('#chatClear'); if(clr) clr.onclick = () => { state.chat = []; persist(); renderCoach(); };
}
async function ask(){
  const q = $('#chatIn').value.trim(); if(!q || chatBusy) return;
  chatBusy = true; $('#chatSend').disabled = true;
  const src = await aiSource();
  const box = $('#chatBox');
  if(!src){ $('#chatNote').innerHTML = esc(sampleErr('no_ai')) + ' <button class="btn ghost sm" data-go="profilo">Vai al Profilo</button>'; chatBusy = false; $('#chatSend').disabled = false; return; }
  if(!state.chat.length) box.innerHTML = '';
  state.chat.push({role:'user', content:q});
  box.insertAdjacentHTML('beforeend', `<div class="msg u">${fmtMsg(q)}</div><div class="msg a" id="pending">${typing}</div>`);
  $('#chatIn').value = ''; $('#chatStop').hidden = false; $('#chatNote').textContent = '';
  const pend = $('#pending'); pend.scrollIntoView({block:'nearest', behavior: reduce ? 'auto' : 'smooth'});
  chatCtl = new AbortController();
  const turns = state.chat.slice(-12); while(turns.length && turns[0].role !== 'user') turns.shift();
  try{
    const text = await aiText({system: RULES(), turns, effort:'low', signal: chatCtl.signal, onText:({text}) => { pend.innerHTML = fmtMsg(text); }});
    state.chat.push({role:'assistant', content:text});
  }catch(e){
    if(e && e.text){ state.chat.push({role:'assistant', content:e.text}); pend.innerHTML = fmtMsg(e.text); }
    else { pend.remove(); }
    if(!(e && e.code === 'cancelled')) $('#chatNote').textContent = sampleErr(e && e.code);
  }
  pend.removeAttribute('id');
  if(state.chat.length > 30) state.chat = state.chat.slice(-30);
  chatBusy = false; $('#chatSend').disabled = false; $('#chatStop').hidden = true;
  if(!$('#chatClear')) $('#chatStop').insertAdjacentHTML('afterend', `<button class="btn ghost sm" type="button" id="chatClear">Nuova conversazione</button>`), $('#chatClear').onclick = () => { state.chat = []; persist(); renderCoach(); };
  persist();
}

/* ================= PROFILO ================= */
function renderProfilo(){
  const p = state.profile;
  const opt = (obj, v) => Object.entries(obj).map(([k, l]) => `<option value="${k}" ${String(v) === k ? 'selected' : ''}>${esc(typeof l === 'string' ? l : l.l)}</option>`).join('');
  const el = $('#p-profilo');
  el.innerHTML = `
    <div><span class="eyebrow">I calcoli partono da qui</span><h2>Il tuo profilo</h2></div>
    ${p.example ? `<div class="example"><span>Questi sono valori di esempio. Sostituiscili con i tuoi e premi Salva.</span></div>` : ''}
    <form class="card glass" id="pForm" novalidate>
      <div class="formgrid">
        <label class="f">Sesso<select id="pf-sex"><option value="m" ${p.sex === 'm' ? 'selected' : ''}>Uomo</option><option value="f" ${p.sex === 'f' ? 'selected' : ''}>Donna</option></select></label>
        <label class="f">Età<input id="pf-age" inputmode="numeric" value="${p.age}"></label>
        <label class="f">Altezza (cm)<input id="pf-height" inputmode="numeric" value="${p.height}"></label>
        <label class="f">Peso (kg)<input id="pf-weight" inputmode="decimal" value="${fmt(+p.weight)}"></label>
      </div>
      <div class="formgrid">
        <label class="f">Obiettivo<select id="pf-goal">${opt(GOALS, p.goal)}</select></label>
        <label class="f">Esperienza<select id="pf-level">${opt(LEVELS, p.level)}</select></label>
        <label class="f">Allenamenti a settimana<select id="pf-days">${[2,3,4,5,6].map(d => `<option value="${d}" ${+p.days === d ? 'selected' : ''}>${d}</option>`).join('')}</select></label>
        <label class="f">Pasti al giorno<select id="pf-meals">${[3,4,5].map(d => `<option value="${d}" ${+p.meals === d ? 'selected' : ''}>${d}</option>`).join('')}</select></label>
      </div>
      <div class="formgrid">
        <label class="f">Attività fuori dalla palestra<select id="pf-activity">${opt(ACT, p.activity)}</select></label>
        <label class="f">Organizzazione della scheda<select id="pf-style">${opt(STYLES, p.style || 'auto')}</select></label>
      </div>
      <p class="small" id="pErr" style="color:var(--red)" hidden></p>
      <div class="row"><button class="btn primary" type="submit">Salva profilo</button></div>
    </form>
    <div class="card glass" id="aiCard"><h3>Coach AI fuori da Claude</h3>
      <p class="small">Dentro l'app Claude il coach usa il tuo account e non serve altro. Nella web app, per esempio quando la apri dalla Home, coach e menù del giorno usano l'API di Claude con una chiave tua: è facoltativa, tutto il resto funziona senza. La crei su <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>.</p>
      <p class="small muted">Il costo va sul tuo account API: pochi centesimi per una risposta. Imposta un limite di spesa nella console. La chiave resta solo in questo browser: non va nel tuo account Claude né su GitHub.</p>
      <label class="f">Chiave API<input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="${getKey() ? 'Chiave salvata · ••••' + esc(getKey().slice(-4)) : 'sk-ant-…'}"></label>
      <div class="row"><button class="btn primary sm" id="keySave">Salva chiave</button>${getKey() ? '<button class="btn sm" id="keyTest">Prova la chiave</button><button class="btn ghost sm" id="keyDel">Rimuovi</button>' : ''}</div>
      <p class="small" id="keyMsg" aria-live="polite"></p>
    </div>
    <div class="card glass"><h3>Colore dell'app</h3>
      <div class="swatches" role="group" aria-label="Colore principale">${ACCENTS.map(([k, l, c]) => `<button class="sw" data-accent="${k}" aria-pressed="${(p.accent || 'blu') === k}" aria-label="${l}" title="${l}" style="background:${c}"></button>`).join('')}</div>
      <p class="small muted" id="accName">${esc((ACCENTS.find(a => a[0] === (p.accent || 'blu')) || ACCENTS[0])[1])}</p>
    </div>
    <div class="card glass"><h3>Dove sono salvati i dati</h3>
      <p class="small">${SYNC.stateRef ? 'Nel tuo account Claude, visibili solo a te: li ritrovi su qualsiasi dispositivo da cui apri questa pagina.' : 'Solo in questo browser. Apri la pagina su claude.ai con il tuo account per salvarli nel tuo account.'}</p>
      <div id="resetBox" class="row"><button class="btn ghost sm" id="resetBtn">Cancella tutti i dati</button></div>
    </div>
    <p class="small muted">Le indicazioni su allenamento e alimentazione sono generali e non sostituiscono medico o nutrizionista.</p>`;
  $('#pForm').onsubmit = e => {
    e.preventDefault();
    const g = k => $('#pf-' + k).value, err = $('#pErr');
    const age = num(g('age')), height = num(g('height')), weight = num(g('weight'));
    const bad = !(age >= 14 && age <= 90) ? ['age', 'L\'età deve essere tra 14 e 90 anni.'] : !(height >= 130 && height <= 220) ? ['height', 'L\'altezza deve essere tra 130 e 220 cm.'] : !(weight >= 30 && weight <= 300) ? ['weight', 'Il peso deve essere tra 30 e 300 kg.'] : null;
    if(bad){ err.textContent = bad[1]; err.hidden = false; $('#pf-' + bad[0]).focus(); haptic([10, 40, 10]); return; }
    state.profile = {...state.profile, sex:g('sex'), age:Math.round(age), height:Math.round(height), weight, goal:g('goal'), level:g('level'), days:+g('days'), meals:+g('meals'), activity:g('activity'), style:g('style'), example:false};
    const lw = sortedWeights().pop();
    if(!lw || Math.abs(lw.kg - weight) > 0.05){ state.weights = state.weights.filter(x => x.date !== iso()); state.weights.push({date:iso(), kg:weight}); }
    persist(); renderAll(); haptic(12); toast('Profilo salvato: scheda e piano aggiornati');
  };
  $('#keySave').onclick = () => {
    const k = $('#apiKey').value.trim(), msg = $('#keyMsg');
    if(!/^sk-ant-[A-Za-z0-9_\-]{20,}$/.test(k)){ msg.style.color = 'var(--red)'; msg.textContent = 'La chiave deve iniziare con sk-ant- . Copiala intera dalla console.'; haptic([10, 40, 10]); return; }
    setKey(k); haptic(10); renderProfilo(); $('#keyMsg').style.color = ''; $('#keyMsg').textContent = 'Chiave salvata su questo dispositivo. Tocca «Prova la chiave» per verificarla.';
  };
  if($('#keyDel')) $('#keyDel').onclick = () => { setKey(''); renderProfilo(); toast('Chiave rimossa da questo dispositivo'); };
  if($('#keyTest')) $('#keyTest').onclick = async () => {
    const b = $('#keyTest'), msg = $('#keyMsg'); b.disabled = true; msg.style.color = ''; msg.innerHTML = typing + ' Provo la chiave…';
    try{ await aiText({force:'api', system:'Rispondi solo con la parola OK.', turns:[{role:'user', content:'Prova'}], effort:'low'}); msg.style.color = 'var(--green)'; msg.textContent = 'La chiave funziona: coach e menù sono attivi anche nella web app.'; haptic(12); }
    catch(e){ msg.style.color = 'var(--red)'; msg.textContent = sampleErr(e && e.code); }
    b.disabled = false;
  };
  el.querySelectorAll('[data-accent]').forEach(b => b.onclick = () => {
    state.profile.accent = b.dataset.accent; applyAccent(); persist(); haptic(8);
    el.querySelectorAll('[data-accent]').forEach(x => x.setAttribute('aria-pressed', x === b));
    $('#accName').textContent = (ACCENTS.find(a => a[0] === b.dataset.accent) || ACCENTS[0])[1];
    requestAnimationFrame(placeIndicator);
  });
  $('#resetBtn').onclick = () => {
    $('#resetBox').innerHTML = `<span class="small">Vuoi cancellare profilo, allenamenti, pesate e chat? Non si può annullare.</span><button class="btn sm" id="rNo">Annulla</button><button class="btn sm primary" id="rYes">Cancella tutto</button>`;
    $('#rNo').onclick = renderProfilo;
    $('#rYes').onclick = () => {
      const ids = state.workouts.map(w => w.id);
      state = merge({pending: ids}); stopTimer(); lockScreen(false);
      persist(); renderAll(); toast('Dati cancellati');
    };
  };
}

/* ================= accent colour ================= */
const ACCENTS = [['blu','Blu','#2F6BD8'],['verde','Verde','#1E8A5A'],['viola','Viola','#6B4FD6'],['arancio','Arancio','#C9620E'],['grafite','Grafite','#2B323C']];
function applyAccent(){ const a = state.profile.accent; if(a && a !== 'blu') document.documentElement.dataset.accent = a; else delete document.documentElement.dataset.accent; }

/* ================= app behaviour ================= */
['gesturestart','gesturechange','gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), {passive:false}));
document.addEventListener('touchmove', e => { if(e.touches.length > 1) e.preventDefault(); }, {passive:false});
window.addEventListener('wheel', e => { if(e.ctrlKey) e.preventDefault(); }, {passive:false});
document.addEventListener('keydown', e => { if((e.ctrlKey || e.metaKey) && ['+','-','=','0'].includes(e.key)) e.preventDefault(); });
document.addEventListener('contextmenu', e => { if(!e.target.closest('input,textarea,.msg,a')) e.preventDefault(); });
document.addEventListener('dragstart', e => { if(e.target.closest('svg,img,a')) e.preventDefault(); });

/* fade the edges of horizontal chip rows only where there is more to scroll */
function fadeRows(){ document.querySelectorAll('.chiprow').forEach(r => { const max = r.scrollWidth - r.clientWidth; r.classList.toggle('more-r', max > 2 && r.scrollLeft < max - 2); r.classList.toggle('more-l', max > 2 && r.scrollLeft > 2); }); }
document.addEventListener('scroll', e => { if(e.target.classList && e.target.classList.contains('chiprow')) fadeRows(); }, true);
new MutationObserver(() => requestAnimationFrame(fadeRows)).observe(document.body, {childList:true, subtree:true});
window.addEventListener('resize', fadeRows);

/* ================= boot ================= */
function renderAll(keepTab){
  applyAccent();
  renderOggi(); renderScheda(); renderTimer(); renderEsercizi(); renderNutrizione(); renderProgressi(); renderCoach(); renderProfilo();
  showTab(tab, {animate:false, scroll:false});
}
const local = loadLocal(); if(local) state = merge(local);
if(state.active && !state.active.ex) state.active = null;
renderAll();
$('#ind').style.transition = 'none';
placeIndicator();
requestAnimationFrame(() => { placeIndicator(); requestAnimationFrame(() => { $('#ind').style.transition = ''; loop(performance.now()); }); });
document.fonts && document.fonts.ready.then(placeIndicator);
setStatus('local');
initStore();
</script></body></html>
