<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E8EBF0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0F14" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ghisa">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Ghisa Coach</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: liquid-glass panels floating over a soft field of olympic-plate colours; glass header on top, floating glass tab capsule at the bottom, one column of panels (max 920px) */
:root{
  --bg:#E8EBF0; --ink:#13171D; --muted:#576170; --line:rgba(19,23,29,.10);
  --glass:rgba(255,255,255,.50); --glass-strong:rgba(255,255,255,.80); --glass-edge:rgba(255,255,255,.80);
  --glass-shadow:rgba(28,38,62,.16); --sheen:rgba(255,255,255,.70); --field:rgba(255,255,255,.62); --sunken:rgba(24,34,52,.06);
  --scrim:rgba(14,18,26,.28); --bar:rgba(248,249,252,.80); --sheet:rgba(246,247,250,.94);
  --red:#C62F3C; --blue:#2A5BB0; --yellow:#B98A10; --green:#1F7F48; --on-accent:#FFFFFF;
  --blob-b:#B5C8F1; --blob-y:#F2DE9F; --blob-g:#BCE2CB;
  --accent-l:#2F6BD8; --accent-d:#6E9EF2; --accent:var(--accent-l);
  --mp:#1F8F7A; --mc:#D08A12; --mf:#7B5BD6;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --spring:cubic-bezier(.32,1.25,.5,1);
  --ease:cubic-bezier(.22,.8,.24,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C0F14; --ink:#EEF1F5; --muted:#9AA4B1; --line:rgba(255,255,255,.09);
  --glass:rgba(32,37,46,.46); --glass-strong:rgba(30,35,44,.86); --glass-edge:rgba(255,255,255,.13);
  --glass-shadow:rgba(0,0,0,.50); --sheen:rgba(255,255,255,.09); --field:rgba(255,255,255,.06); --sunken:rgba(255,255,255,.06);
  --scrim:rgba(0,0,0,.45); --bar:rgba(22,26,33,.82); --sheet:rgba(20,24,31,.95);
  --red:#EE5D69; --blue:#719BE8; --yellow:#E9BD4A; --green:#57C281; --on-accent:#0C0F14;
  --blob-b:#1C3263; --blob-y:#4C3C10; --blob-g:#15442A; --accent:var(--accent-d); --mp:#33A68E; --mc:#B97C1C; --mf:#8F74E6; color-scheme:dark}}
:root[data-accent="verde"]{--accent-l:#1E8A5A; --accent-d:#4CC38A}
:root[data-accent="viola"]{--accent-l:#6B4FD6; --accent-d:#A08BF3}
:root[data-accent="arancio"]{--accent-l:#C9620E; --accent-d:#F29A4E}
:root[data-accent="grafite"]{--accent-l:#2B323C; --accent-d:#DCE2EA}
:root[data-theme="dark"]{
  --bg:#0C0F14; --ink:#EEF1F5; --muted:#9AA4B1; --line:rgba(255,255,255,.09);
  --glass:rgba(32,37,46,.46); --glass-strong:rgba(30,35,44,.86); --glass-edge:rgba(255,255,255,.13);
  --glass-shadow:rgba(0,0,0,.50); --sheen:rgba(255,255,255,.09); --field:rgba(255,255,255,.06); --sunken:rgba(255,255,255,.06);
  --scrim:rgba(0,0,0,.45); --bar:rgba(22,26,33,.82); --sheet:rgba(20,24,31,.95);
  --red:#EE5D69; --blue:#719BE8; --yellow:#E9BD4A; --green:#57C281; --on-accent:#0C0F14;
  --blob-b:#1C3263; --blob-y:#4C3C10; --blob-g:#15442A; --accent:var(--accent-d); --mp:#33A68E; --mc:#B97C1C; --mf:#8F74E6; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0}
.glass.bar{background:linear-gradient(160deg,var(--sheen) 0%,transparent 45%),var(--bar)}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;overscroll-behavior-y:none}
.field{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(42% 34% at 8% 6%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 72%),
    radial-gradient(46% 38% at 96% 18%, var(--blob-b), transparent 72%),
    radial-gradient(40% 32% at 88% 92%, var(--blob-y), transparent 72%),
    radial-gradient(44% 36% at 6% 84%, var(--blob-g), transparent 72%),
    var(--bg)}
.glass{background:linear-gradient(155deg,var(--sheen) 0%,transparent 42%),var(--glass);
  -webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);
  border:1px solid var(--glass-edge);box-shadow:0 12px 34px -14px var(--glass-shadow),inset 0 1px 0 var(--sheen)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:var(--glass-strong)}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--glass-strong)}
.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;border-width:0 0 1px;border-radius:0;box-shadow:0 6px 24px -18px var(--glass-shadow)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px}
.brand h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.03em;margin:0;text-transform:uppercase;display:flex;align-items:center;gap:9px;line-height:1}
.logo{width:22px;height:22px;flex:0 0 auto}
.hbtns{display:flex;align-items:center;gap:8px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:5px 10px;border-radius:999px;white-space:nowrap}
.status i{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:0 0 auto;transition:background .3s}
.status[data-s="ok"] i{background:var(--green)}
.status[data-s="saving"] i{background:var(--yellow);animation:pulse 1s ease-in-out infinite}
.status[data-s="error"] i{background:var(--red)}
@keyframes pulse{50%{opacity:.35}}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink);cursor:pointer;padding:0;transition:transform .2s var(--spring),background .2s}
.iconbtn svg{width:20px;height:20px}
.iconbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.iconbtn:active{transform:scale(.9)}

/* bottom tab capsule */
nav.dock{position:fixed;z-index:9;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));
  width:min(480px,calc(100% - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));
  border-radius:999px;padding:6px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav.dock .ind{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:999px;background:var(--glass-strong);
  box-shadow:0 4px 14px -6px var(--glass-shadow),inset 0 1px 0 var(--sheen);border:1px solid var(--glass-edge);
  transition:transform .45s var(--spring),width .45s var(--spring),opacity .25s}
nav.dock button{position:relative;z-index:1;background:none;border:0;color:var(--muted);display:grid;justify-items:center;gap:1px;padding:6px 2px 5px;border-radius:999px;cursor:pointer;font:600 10.5px var(--body);letter-spacing:.02em;transition:color .25s,transform .2s var(--spring);min-width:0}
nav.dock button svg{width:22px;height:22px}
nav.dock button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
nav.dock button[aria-selected="true"]{color:var(--accent)}
nav.dock button:active{transform:scale(.92)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

main{padding-block:18px calc(120px + env(safe-area-inset-bottom,0px))}
main.timer-on{padding-bottom:calc(190px + env(safe-area-inset-bottom,0px))}
section.panel{display:grid;gap:16px}
section.panel.in-r{animation:inR .32s var(--ease)}
section.panel.in-l{animation:inL .32s var(--ease)}
section.panel.in-f{animation:inF .28s var(--ease)}
@keyframes inR{from{opacity:0;transform:translateX(28px)}}
@keyframes inL{from{opacity:0;transform:translateX(-28px)}}
@keyframes inF{from{opacity:0;transform:translateY(8px)}}
h2{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05;margin:0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.15;margin:0;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{border-radius:22px;padding:18px;display:grid;gap:12px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.btn{font:600 15px var(--body);border-radius:999px;border:1px solid var(--glass-edge);background:var(--field);color:var(--ink);padding:9px 18px;cursor:pointer;min-height:42px;
  box-shadow:inset 0 1px 0 var(--sheen);transition:transform .2s var(--spring),background .2s,opacity .2s;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.btn:hover{background:var(--glass-strong)}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 55%),var(--accent);border-color:transparent;color:var(--on-accent);box-shadow:0 8px 20px -10px var(--accent),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.blue{background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 55%),var(--accent);border-color:transparent;color:var(--on-accent);box-shadow:0 8px 20px -10px var(--accent),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.ghost{background:none;border-color:transparent;box-shadow:none;color:var(--muted);-webkit-backdrop-filter:none;backdrop-filter:none}
.btn.ghost:hover{background:var(--sunken)}
.btn.sm{padding:5px 13px;min-height:34px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default;transform:none}
a{color:var(--blue)}
label.f{display:grid;gap:5px;font-size:13px;color:var(--muted);min-width:0}
input,select,textarea{font:500 16px var(--body);color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:14px;padding:9px 12px;min-height:44px;width:100%;min-width:0;
  box-shadow:inset 0 1px 2px var(--sunken);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 22%,transparent)}
select{appearance:none;-webkit-appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat}
textarea{resize:vertical;min-height:72px;line-height:1.4}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--glass-edge);border-radius:999px;padding:6px 13px;font:500 13px var(--body);background:var(--field);color:var(--ink);cursor:pointer;transition:transform .2s var(--spring),background .2s,color .2s;text-align:left}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:999px;background:var(--sunken);color:var(--muted);letter-spacing:.03em;white-space:nowrap}
.note{background:var(--sunken);border-radius:14px;padding:11px 13px;font-size:14px}
.example{border:1px dashed var(--yellow);border-radius:14px;padding:10px 13px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.stat{border-radius:18px;padding:13px 15px;display:grid;gap:3px;align-content:start}
.stat b{font-family:var(--display);font-size:32px;font-weight:700;line-height:1}
.stat span{font-size:12px;color:var(--muted)}
.stat .key{width:22px;height:4px;border-radius:2px;margin-bottom:4px}
.week{display:flex;gap:6px}
.week div{flex:1;text-align:center;font-family:var(--mono);font-size:11px;color:var(--muted);display:grid;gap:5px;justify-items:center}
.week i{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal}
.week i.on{border-color:var(--accent);background:var(--accent);box-shadow:0 4px 10px -4px var(--accent)}
.week i.on::after{content:"";width:8px;height:5px;border:2px solid var(--on-accent);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.week i.today{border-color:var(--ink)}

/* macro bar */
.mbar{display:flex;gap:2px;height:12px;border-radius:6px;overflow:hidden}
.mbar span{display:block;border-radius:3px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
.p-c{background:var(--mp)}.c-c{background:var(--mc)}.f-c{background:var(--mf)}

/* lists */
ul.clean{list-style:none;margin:0;padding:0;display:grid;gap:9px}
ol.steps{margin:0;padding-left:0;list-style:none;counter-reset:st;display:grid;gap:9px}
ol.steps li{counter-increment:st;display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start}
ol.steps li::before{content:counter(st);width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font:600 12px var(--mono);display:grid;place-items:center;margin-top:1px}
.exrow{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.exrow:first-child{border-top:0;padding-top:0}
.seg{display:inline-flex;justify-self:start;padding:4px;border-radius:999px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{border:0;background:none;padding:8px 14px;border-radius:999px;font:600 14px var(--body);color:var(--muted);cursor:pointer;transition:background .25s,color .25s,transform .2s var(--spring)}
.seg button:active{transform:scale(.96)}
.seg button[aria-pressed="true"]{background:var(--glass-strong);color:var(--ink);box-shadow:0 4px 12px -6px var(--glass-shadow),inset 0 1px 0 var(--sheen)}
.gcard .top{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:12px;align-items:center}
.gcard .top svg{width:64px;height:64px;border-radius:16px;background:var(--sunken)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid var(--glass-edge);cursor:pointer;box-shadow:0 4px 12px -6px var(--glass-shadow);transition:transform .2s var(--spring)}
.sw:active{transform:scale(.9)}
.sw[aria-pressed="true"]{border-color:var(--ink);outline:2px solid var(--glass-strong);outline-offset:-6px}
.exrow.s3{grid-template-columns:58px minmax(0,1fr) auto}
#libGrid{display:grid;gap:12px}
.libh{display:flex;gap:8px;align-items:baseline;margin-top:10px}
.exrow svg{width:58px;height:58px;border-radius:14px;background:var(--sunken)}
.exname{background:none;border:0;padding:0;font:600 16px var(--body);color:var(--ink);text-align:left;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.exname::after{content:"";width:6px;height:6px;border:2px solid var(--muted);border-left:0;border-bottom:0;transform:rotate(45deg);flex:0 0 auto}
.tips li{display:grid;grid-template-columns:8px 1fr;gap:11px;align-items:start}
.tips li::before{content:"";width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--c,var(--blue))}

/* library */
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,158px),1fr));gap:12px}
.libcard{border-radius:20px;padding:10px;display:grid;gap:6px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:transform .25s var(--spring)}
.libcard:active{transform:scale(.97)}
.libcard svg{width:100%;aspect-ratio:1/1;max-width:100%;background:var(--sunken);border-radius:14px;display:block}
.libcard strong{font-family:var(--display);font-size:18px;letter-spacing:.02em;text-transform:uppercase;line-height:1.1}
.chiprow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:-2px}
.chiprow::-webkit-scrollbar{display:none}
.chiprow .chip{flex:0 0 auto}

/* session */
.prog{height:6px;border-radius:3px;background:var(--sunken);overflow:hidden}
.prog span{display:block;height:100%;background:var(--green);border-radius:3px;transition:width .4s var(--ease)}
.sx{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:9px}
.sx:first-of-type{border-top:0;padding-top:0}
.sets{display:grid;gap:7px}
.set,.sethead{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) 46px;gap:8px;align-items:center}
.sethead{font-size:11px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:center}
.set .n{font-family:var(--mono);color:var(--muted);font-size:13px;text-align:center}
.set input{text-align:center;font-family:var(--mono);transition:border-color .25s,background .25s}
.set .ok{width:46px;height:44px;border-radius:14px;border:1.5px solid var(--line);background:var(--field);cursor:pointer;color:var(--muted);display:grid;place-items:center;transition:background .25s,border-color .25s,transform .25s var(--spring),color .25s}
.set .ok svg{width:20px;height:20px}
.set .ok:active{transform:scale(.88)}
.set .ok[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-accent);box-shadow:0 6px 14px -8px var(--green)}
.set.done input{border-color:color-mix(in srgb,var(--green) 60%,transparent);background:color-mix(in srgb,var(--green) 9%,var(--field))}
.hint{font-size:13px;border-left:3px solid var(--accent);padding-left:9px;color:var(--muted)}

/* timer pill */
.timer{position:fixed;z-index:9;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));
  width:min(480px,calc(100% - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));
  border-radius:24px;padding:10px 12px;display:flex;align-items:center;gap:12px;transform:translateX(-50%);
  transition:transform .4s var(--spring),opacity .3s;touch-action:pan-x}
.timer.enter{transform:translateX(-50%) translateY(30px);opacity:0}
.timer .ring{width:46px;height:46px;flex:0 0 auto}
.timer .ring circle{fill:none;stroke-width:4}
.timer b{font-family:var(--mono);font-size:24px;font-weight:600;flex:1;min-width:0}
.timer small{display:block;font:500 11px var(--body);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}

/* toast */
.toast{position:fixed;z-index:40;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translate(-50%,-14px);opacity:0;pointer-events:none;
  border-radius:20px;padding:10px 18px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center;transition:transform .4s var(--spring),opacity .25s}
.toast.show{transform:translate(-50%,0);opacity:1}

/* sheet */
.overlay{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 24px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;transition:opacity .3s}
.overlay.open{opacity:1}
.sheet{background:linear-gradient(170deg,var(--sheen),transparent 30%),var(--sheet);-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);
  border:1px solid var(--glass-edge);box-shadow:0 -10px 40px -10px var(--glass-shadow);
  width:100%;max-width:720px;max-height:100%;overflow:auto;overscroll-behavior:contain;border-radius:28px 28px 0 0;

.tip .k{display:inline-block;width:12px;height:2px;background:var(--accent);vertical-align:middle;margin-right:5px}

.chat{display:grid;gap:10px}
.msg{padding:10px 14px;border-radius:20px;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere;animation:inF .25s var(--ease)}

table{border-collapse:collapse;width:100%;font-size:14px}

details[open] summary::before{transform:rotate(45deg)}
.foot{font-size:12px;color:var(--muted);padding-top:6px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition-duration:.01ms!important;animation:none!important}}

/* ================= state & storage ================= */
const DEFAULT = {profile:{sex:'m', age:28, height:178, weight:78, activity:'1.375', goal:'ricomp', level:'beginner', days:3, meals:4, example:true}, workouts:[], weights:[], active:null, chat:[], pending:[], swaps:{}, savedAt:0};
let state = structuredClone(DEFAULT);
const LS = 'ghisa-coach-v2';
const SYNC = {stateRef:null, woCol:null, chain:Promise.resolve(), t:null};
function loadLocal(){ try{ const j = localStorage.getItem(LS) || localStorage.getItem('ghisa-coach-v1'); if(j) return JSON.parse(j); }catch(e){} return null; }
function saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){} }
function merge(s){
  const m = {...structuredClone(DEFAULT), ...(s || {}), profile:{...DEFAULT.profile, ...((s && s.profile) || {})}};
  m.workouts = (m.workouts || []).map(w => ({...w, id: w.id || uidGen(), ts: w.ts || dayNum(w.date) * 864e5}));
  m.weights = (m.weights || []).filter(x => x && x.date && x.kg > 0);
  m.chat = (m.chat || []).filter(x => x && x.content);
  m.pending = Array.isArray(m.pending) ? m.pending : [];
  m.swaps = m.swaps && typeof m.swaps === 'object' && !Array.isArray(m.swaps) ? m.swaps : {};
  return m;
}
function setStatus(s){
  const el = $('#saveState'); el.dataset.s = s;
  el.querySelector('span').textContent = {ok:'Sincronizzato', saving:'Salvataggio', error:'Non sincronizzato', local:'Su questo dispositivo', ready:'Pronto'}[s];
  el.title = {ok:'Dati salvati nel tuo account Claude', saving:'Salvataggio in corso', error:'Non riesco a salvare nel tuo account: i dati restano su questo dispositivo e riprovo alla prossima modifica', local:'Dati salvati solo in questo browser', ready:'Pronto'}[s];
}
const remoteState = () => ({profile:state.profile, weights:state.weights, active:state.active, swaps:state.swaps, chat:state.chat.slice(-30).map(m => ({role:m.role, content:String(m.content).slice(0, 3000)}))});
function queue(fn){ SYNC.chain = SYNC.chain.then(fn).catch(e => { setStatus('error'); throw e; }).catch(() => {}); return SYNC.chain; }
function flushPending(){
  if(!SYNC.woCol) return;
  state.pending.slice().forEach(id => {
    const w = state.workouts.find(x => x.id === id);
    queue(async () => {
      if(w) await SYNC.woCol.doc(id).set(w); else await SYNC.woCol.doc(id).delete();
      state.pending = state.pending.filter(x => x !== id); saveLocal();
    });
  });
}
function persist(){
  state.savedAt = Date.now();
  saveLocal();
  if(!SYNC.stateRef){ setStatus('local'); return; }
  setStatus('saving');
  clearTimeout(SYNC.t);
  SYNC.t = setTimeout(() => {
    flushPending();
    queue(async () => { await SYNC.stateRef.set({state: JSON.parse(JSON.stringify(remoteState())), savedAt: state.savedAt, v:2}); })
      .then(() => { if($('#saveState').dataset.s === 'saving') setStatus('ok'); });
  }, 600);
}
function markWorkout(id){ if(!state.pending.includes(id)) state.pending.push(id); persist(); }
async function initStore(){
  const C = window.claude;
  if(!C || !C.use){ setStatus('local'); return; }
  try{
    const [db, user] = await Promise.all([C.use('db'), C.use('user')]);
    if(!db || !user){ setStatus('local'); return; }
    const id = await user.id();
    if(!id){ setStatus('local'); return; }
    const stateRef = db.doc('data/users/' + id + '/state');
    const woCol = stateRef.collection('workouts');
    const [snap, wsnap] = await Promise.all([stateRef.get(), woCol.limit(1000).get()]);
    SYNC.stateRef = stateRef; SYNC.woCol = woCol;
    const before = JSON.stringify(state);
    const remote = snap.exists ? snap.data() : null;
    const remoteWos = new Map(wsnap.docs.map(d => [d.id, d.data()]));
    if(remote && Array.isArray(remote.state && remote.state.workouts)){ // first version kept workouts inside the state doc
      remote.state.workouts.forEach(w => { const m = merge({workouts:[w]}).workouts[0]; if(!remoteWos.has(m.id)){ remoteWos.set(m.id, m); state.pending.push(m.id); state.workouts.push(m); } });
    }
    const pendingIds = new Set(state.pending);
    const localOnly = state.workouts.filter(w => pendingIds.has(w.id) && !remoteWos.has(w.id));
    const merged = [...remoteWos.values()].filter(w => !(pendingIds.has(w.id) && !state.workouts.some(x => x.id === w.id)));
    if(remote && (remote.savedAt || 0) > (state.savedAt || 0)){
      const r = merge(remote.state);
      state.profile = r.profile; state.weights = r.weights; state.active = r.active; state.chat = r.chat; state.swaps = r.swaps; state.savedAt = remote.savedAt;
    }
    state.workouts = [...merged, ...localOnly].map(w => merge({workouts:[w]}).workouts[0]).sort((a, b) => a.ts - b.ts);
    saveLocal();
    if(JSON.stringify(state) !== before) renderAll();
    if(!remote || state.pending.length || (remote.savedAt || 0) < (state.savedAt || 0) || Array.isArray(remote.state && remote.state.workouts)) persist();
    else setStatus('ok');
  }catch(e){ SYNC.stateRef = null; SYNC.woCol = null; setStatus('local'); }
}

/* ================= calculations ================= */
function nutr(){
  const p = state.profile, w = +p.weight, h = +p.height, a = +p.age;
  const bmr = 10*w + 6.25*h - 5*a + (p.sex === 'm' ? 5 : -161);
  const train = (+p.days * 250) / 7;
  const tdee = bmr * +p.activity + train;
  const G = GOALS[p.goal] || GOALS.ricomp;
  const bmi = w / ((h/100) ** 2);
  const refW = bmi > 30 ? 27 * (h/100) ** 2 : w;
  let kcal = Math.round(tdee * (1 + G.kcal) / 10) * 10;
  kcal = Math.max(kcal, p.sex === 'm' ? 1500 : 1200);
  const prot = Math.round(G.prot * refW);
  const fat = Math.round(Math.max(0.8 * refW, kcal * 0.25 / 9));
  const carb = Math.max(0, Math.round((kcal - prot*4 - fat*9) / 4));
  return {bmr:Math.round(bmr), tdee:Math.round(tdee), kcal, p:prot, f:fat, c:carb, bmi, refW,
    water: Math.round((w*35 + 500) / 100) / 10, fiber: Math.round(kcal / 1000 * 14)};
}
const baseId = id => state.profile.level === 'beginner' && BEGINNER_SWAP[id] ? BEGINNER_SWAP[id] : id;
const planSig = () => (state.profile.style === 'muscoli' ? 'm' : '') + Math.min(6, Math.max(2, +state.profile.days || 3));
const planKey = (di, pos) => `${planSig()}:${di}:${pos}`;
function split(){
  const d = Math.min(6, Math.max(2, +state.profile.days || 3));
  const src = state.profile.style === 'muscoli' ? MUSCLE_SPLITS : SPLITS;
  return src[d].map((day, di) => ({...day, base: day.ex.map(baseId), ex: day.ex.map((id, pos) => {
    const sw = state.swaps[planKey(di, pos)];
    return sw && EX[sw] ? sw : baseId(id);
  })}));
}
const UNIT_LONG = {rip:'ripetizioni', s:'secondi', min:'minuti'};
function presc(id){
  const G = GOALS[state.profile.goal] || GOALS.ricomp, X = EX[id];
  if(X.type === 'cardio') return {s:1, r: state.profile.goal === 'cut' ? [20,35] : [15,25], rest:0, unit:'min'};
  let s = G.s, r = G.r.slice(), rest = G.rest;
  if(X.type === 'iso'){ r = [Math.max(10, r[0]+2), Math.max(15, r[1]+3)]; rest = Math.min(rest, 75); s = 3; }
  if(X.type === 'core'){ r = X.timed ? [30,45] : [12,20]; rest = 60; s = 3; }
  if(X.bw && X.type === 'comp') r = [8,15];
  if(X.rr) r = X.rr.slice();
  if(state.profile.level === 'beginner') s = Math.min(s, 3);
  return {s, r, rest, unit: X.timed ? 's' : 'rip'};
}
function lastFor(id){
  for(let i = state.workouts.length - 1; i >= 0; i--){
    const e = state.workouts[i].ex.find(x => x.id === id);
    if(e && e.sets.length) return {date: state.workouts[i].date, sets: e.sets};
  }
  return null;
}
function suggest(id){
  const p = presc(id), X = EX[id], last = lastFor(id), U = UNIT_LONG[p.unit];
  if(X.type === 'cardio') return {kg:null, text: last ? `Ultima volta: ${num(last.sets[0].reps)} minuti${num(last.sets[0].kg) ? ', ' + fmt(num(last.sets[0].kg)) + ' km' : ''}. Stesso ritmo, prova ad aggiungere 2–3 minuti.` : `${p.r[0]}–${p.r[1]} minuti a un ritmo in cui riesci a parlare a frasi brevi.`};
  if(!last){
    if(X.bw) return {kg:null, text:`Prima volta: ${p.s} serie, cercando di arrivare a ${p.r[0]}–${p.r[1]} ${U}.`};
    if(X.timed) return {kg:null, text:`Prima volta: ${p.s} serie da ${p.r[0]}–${p.r[1]} secondi con un carico impegnativo ma gestibile.`};
    return {kg:null, text:`Prima volta: scegli un carico con cui chiudi ${p.r[1]} ripetizioni lasciandone 2–3 di margine.`};
  }
  const maxKg = Math.max(0, ...last.sets.map(s => num(s.kg)));
  const allTop = last.sets.length >= p.s && last.sets.every(s => num(s.reps) >= p.r[1]);
  const anyLow = last.sets.some(s => num(s.reps) < p.r[0]);
  if(!maxKg){
    if(allTop) return {kg:null, text: X.timed ? `Hai tenuto ${p.r[1]} secondi in tutte le serie: passa a ${p.r[1] + 15}.` : `Tutte le serie al massimo: aggiungi un piccolo carico o rallenta la discesa.`};
    return {kg:null, text:`L'ultima volta: ${last.sets.map(s => num(s.reps)).join(' · ')} ${U}. Prova a fare +1 in ogni serie.`};

  const ms = Math.max(0, tEnd - Date.now()), left = Math.ceil(ms / 1000);
  $('#tLeft').textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
  $('#tRing').setAttribute('stroke-dashoffset', (RING * (1 - ms / (tTotal * 1000))).toFixed(2));
  if(ms <= 0){ beep(); haptic([200, 100, 200]); toast('Recupero finito: prossima serie'); stopTimer(); }
}
function stopTimer(){
  clearInterval(tInt); tInt = null;
  const t = $('#timer'); if(t.hidden) return;
  t.classList.add('enter');
  setTimeout(() => { if(!tInt){ t.hidden = true; t.classList.remove('enter'); t.style.transform = ''; $('#main').classList.remove('timer-on'); } }, reduce ? 0 : 300);
}
$('#tPlus').onclick = () => { tEnd += 15000; tTotal += 15; tick(); haptic(5); };
$('#tMinus').onclick = () => { tEnd -= 15000; tTotal = Math.max(1, tTotal - 15); tick(); haptic(5); };
$('#tSkip').onclick = () => { stopTimer(); haptic(5); };
(() => { // swipe the timer pill sideways or down to skip
  const t = $('#timer'); let x0 = null, y0 = 0;
  t.addEventListener('touchstart', e => { if(e.target.closest('button')) return; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t.style.transition = 'none'; }, {passive:true});
  t.addEventListener('touchmove', e => { if(x0 === null) return; const dx = e.touches[0].clientX - x0, dy = Math.max(0, e.touches[0].clientY - y0); t.style.transform = `translateX(calc(-50% + ${dx}px)) translateY(${dy}px)`; t.style.opacity = String(Math.max(.3, 1 - Math.max(Math.abs(dx), dy) / 220)); }, {passive:true});
  t.addEventListener('touchend', e => {
    if(x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    t.style.transition = ''; t.style.opacity = '';
    if(Math.abs(dx) > 90 || dy > 60){ haptic(6); stopTimer(); } else t.style.transform = '';
  });
})();

      ${Object.keys(prs).length ? `<div class="scroll"><table><tr><th>Esercizio</th><th class="r">Miglior serie</th><th class="r">Massimale stimato</th><th class="r">Data</th></tr>${Object.entries(prs).map(([id, x]) => `<tr><td>${esc(EX[id] ? EX[id].n : id)}</td><td class="r num">${fmt(x.kg)} × ${x.reps}</td><td class="r num">${fmt(x.v, 0)} kg</td><td class="r num">${dItal(x.date)}</td></tr>`).join('')}</table></div><p class="small muted">Massimale stimato con la formula di Epley: non serve provarlo davvero.</p>` : `<p class="muted">Compariranno qui dopo il primo allenamento con i carichi segnati.</p>`}
    </div>
    <div class="card glass"><h3>Storico allenamenti</h3>
      ${state.workouts.length ? `<div class="scroll"><table><tr><th>Data</th><th>Seduta</th><th class="r">Serie</th><th class="r">Volume</th><th class="r">Durata</th><th></th></tr>${state.workouts.slice().reverse().map(x => `<tr id="wo-${x.id}"><td class="num">${dItal(x.date)}</td><td>${esc(x.n)}</td><td class="r num">${x.ex.reduce((a, e) => a + e.sets.length, 0)}</td><td class="r num">${Math.round(vol(x)).toLocaleString('it-IT')} kg</td><td class="r num">${x.min} min</td><td class="r"><button class="btn ghost sm" data-delwo="${x.id}" aria-label="Elimina allenamento del ${dItal(x.date)}">Elimina</button></td></tr>`).join('')}</table></div><p class="small muted">Volume = somma di chili × ripetizioni. Se sale nel tempo, stai progredendo.</p>` : `<p class="muted">Nessun allenamento registrato. Inizia dalla scheda di Oggi: ogni serie che segni finisce qui.</p>`}
    </div>`;
  $('#wForm').onsubmit = e => {
    e.preventDefault();
    const kg = num($('#wKg').value), waist = num($('#wWaist').value), d = $('#wDate').value || iso(), err = $('#wErr');
    if(!(kg >= 30 && kg <= 300)){ err.textContent = 'Inserisci un peso tra 30 e 300 kg.'; err.hidden = false; $('#wKg').focus(); haptic([10, 40, 10]); return; }
    if(d > iso()){ err.textContent = 'La data non può essere nel futuro.'; err.hidden = false; return; }
    state.weights = state.weights.filter(x => x.date !== d); state.weights.push({date:d, kg, ...(waist >= 40 && waist <= 250 ? {waist} : {})});
    syncProfileWeight(); persist(); renderAll(); haptic(10); toast(`Pesata del ${dItal(d)} salvata: ${fmt(kg)} kg`);
  };
  el.querySelectorAll('[data-delw]').forEach(b => b.onclick = () => askDelete(b, () => { state.weights = state.weights.filter(x => x.date !== b.dataset.delw); syncProfileWeight(); persist(); renderAll(); toast('Pesata eliminata'); }));
  el.querySelectorAll('[data-delwo]').forEach(b => b.onclick = () => askDelete(b, () => { const id = b.dataset.delwo; state.workouts = state.workouts.filter(x => x.id !== id); markWorkout(id); renderAll(); toast('Allenamento eliminato'); }));
  bindChart(el);
}
function askDelete(btn, fn, label = 'Elimina'){ // second tap within 3 s confirms
  if(btn.dataset.armed){ fn(); return; }
  btn.dataset.armed = 1; btn.textContent = 'Tocca di nuovo per confermare'; btn.style.color = 'var(--red)'; haptic(8);
  setTimeout(() => { if(btn.isConnected){ delete btn.dataset.armed; btn.textContent = label; btn.style.color = ''; } }, 3000);
}
let chartData = null, chartRO = null;
function weightChart(w){
  if(w.length < 2){ chartData = null; return `<div class="note small">Aggiungi almeno due pesate per vedere il grafico. Pesati al mattino, dopo il bagno e prima di colazione.</div>`; }
  return `<div class="chartbox" id="chartBox" style="min-height:200px"></div>
  <div class="legend small muted"><span><i class="dot" style="background:var(--muted);border-radius:50%"></i>Pesate singole</span><span><i class="dot" style="background:var(--accent);height:3px;width:14px;border-radius:2px"></i>Media degli ultimi 7 giorni (quella che conta)</span></div>`;
}
function chartSVG(w, W){
  const H = W < 480 ? 200 : 230, L = 36, R = 14, T = 14, B = 26;
  const d0 = dayNum(w[0].date), d1 = dayNum(w[w.length-1].date);
  const avg = w.map(x => { const d = dayNum(x.date); const win = w.filter(y => { const u = dayNum(y.date); return u <= d && u > d - 7; }); return {date:x.date, kg:x.kg, avg: win.reduce((a, y) => a + y.kg, 0) / win.length}; });
  const ks = w.map(x => x.kg), lo = Math.floor(Math.min(...ks) - .5), hi = Math.ceil(Math.max(...ks) + .5);
  const X = d => L + (dayNum(d) - d0) / Math.max(1, d1 - d0) * (W - L - R), Y = k => T + (hi - k) / Math.max(1, hi - lo) * (H - T - B);
  const step = Math.max(1, Math.ceil((hi - lo) / 4));
  let grid = ''; for(let k = lo; k <= hi; k += step) grid += `<line x1="${L}" x2="${W-R}" y1="${Y(k).toFixed(1)}" y2="${Y(k).toFixed(1)}" stroke="var(--line)"/><text x="${L-6}" y="${(Y(k)+3).toFixed(1)}" text-anchor="end">${k}</text>`;
  const line = avg.map(a => `${X(a.date).toFixed(1)},${Y(a.avg).toFixed(1)}`).join(' ');
  const area = `M${X(avg[0].date).toFixed(1)},${H-B} L${line.replace(/ /g, ' L')} L${X(avg[avg.length-1].date).toFixed(1)},${H-B} Z`;
  const last = avg[avg.length-1];
  chartData = {pts: avg.map(a => ({...a, x:X(a.date), y:Y(a.kg), ya:Y(a.avg)})), W, H, T, B};
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Andamento del peso dal ${dItal(w[0].date)} al ${dItal(w[w.length-1].date)}: da ${fmt(w[0].kg)} a ${fmt(last.kg)} kg">
    ${grid}
    <path d="${area}" fill="var(--accent)" opacity=".12"/>
    <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${chartData.pts.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="var(--muted)" opacity=".7"/>`).join('')}
    <circle cx="${X(last.date).toFixed(1)}" cy="${Y(last.avg).toFixed(1)}" r="5" fill="var(--accent)" stroke="var(--glass-strong)" stroke-width="2"/>
    <line id="cross" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-dasharray="3 3" opacity="0"/>
    <circle id="crossDot" r="5" fill="var(--accent)" stroke="var(--glass-strong)" stroke-width="2" opacity="0"/>
    <text x="${L}" y="${H-8}">${dItal(w[0].date)}</text><text x="${W-R}" y="${H-8}" text-anchor="end">${dItal(w[w.length-1].date)}</text>
    <rect id="hit" x="${L}" y="0" width="${W-L-R}" height="${H}" fill="transparent" tabindex="0" aria-label="Esplora i valori del grafico con le frecce"/>
  </svg><div class="tip glass bar" id="cTip"></div>`;
}
function bindChart(root){
  const box = root.querySelector('#chartBox'); if(!box) return;
  const w = sortedWeights();
  let drawnW = 0;
  const draw = () => {
    const W = Math.round(box.clientWidth); if(!W || W === drawnW) return;
    drawnW = W; box.style.minHeight = ''; box.innerHTML = chartSVG(w, W); wireChart(box);
  };
  if(chartRO) chartRO.disconnect();
  chartRO = 'ResizeObserver' in window ? new ResizeObserver(draw) : null;
  if(chartRO) chartRO.observe(box); else { window.addEventListener('resize', draw); }
  draw();
}
function wireChart(box){
  const svg = box.querySelector('svg'), hit = svg.querySelector('#hit'), cross = svg.querySelector('#cross'), dot = svg.querySelector('#crossDot'), tip = box.querySelector('#cTip');
  let cur = -1;
  const show = i => {
    cur = Math.max(0, Math.min(chartData.pts.length - 1, i));
    const p = chartData.pts[cur], r = svg.getBoundingClientRect(), sx = r.width / chartData.W;
    cross.setAttribute('x1', p.x); cross.setAttribute('x2', p.x); cross.setAttribute('opacity', '.8');
    dot.setAttribute('cx', p.x); dot.setAttribute('cy', p.ya); dot.setAttribute('opacity', '1');
    tip.textContent = '';
    const s = document.createElement('strong'); s.textContent = fmt(p.kg) + ' kg'; tip.append(s);
    const d = document.createElement('div'); d.className = 'muted'; d.textContent = 'Pesata del ' + dItal(p.date); tip.append(d);
    const a = document.createElement('div'); const k = document.createElement('i'); k.className = 'k'; a.append(k, 'media 7 gg: ' + fmt(p.avg) + ' kg'); tip.append(a);
    tip.classList.add('on');
    const tw = tip.offsetWidth, x = Math.min(Math.max(p.x * sx, tw / 2 + 2), r.width - tw / 2 - 2);
    tip.style.left = x + 'px'; tip.style.top = Math.max(0, p.y * sx - tip.offsetHeight - 14) + 'px';
  };
  const hide = () => { cross.setAttribute('opacity', '0'); dot.setAttribute('opacity', '0'); tip.classList.remove('on'); cur = -1; };
  const nearest = clientX => { const r = svg.getBoundingClientRect(), x = (clientX - r.left) / r.width * chartData.W; let bi = 0, bd = Infinity; chartData.pts.forEach((p, i) => { const d = Math.abs(p.x - x); if(d < bd){ bd = d; bi = i; } }); return bi; };
  hit.addEventListener('pointermove', e => show(nearest(e.clientX)));
  hit.addEventListener('pointerdown', e => show(nearest(e.clientX)));
  hit.addEventListener('pointerleave', hide);
  hit.addEventListener('focus', () => show(chartData.pts.length - 1));
  hit.addEventListener('blur', hide);
  hit.addEventListener('keydown', e => { if(e.key === 'ArrowLeft'){ e.preventDefault(); show(cur - 1); } if(e.key === 'ArrowRight'){ e.preventDefault(); show(cur + 1); } });
}

/* ================= COACH ================= */
let chatCtl = null, chatBusy = false;
function context(){
  const p = state.profile, n = nutr(), sp = split();
  const recent = state.workouts.slice(-6).map(w => `${w.date} ${w.n}: ` + w.ex.map(e => (EX[e.id] ? EX[e.id].n : e.id) + ' ' + e.sets.map(s => (num(s.kg) ? num(s.kg) + 'kg×' : '') + num(s.reps)).join(', ')).join('; ')).join('\n');
  const wts = sortedWeights().slice(-10).map(x => `${x.date} ${x.kg}kg${x.waist ? ' vita ' + x.waist + 'cm' : ''}`).join(', ');
  return `DATI DELL'UTENTE
Profilo: ${p.sex === 'm' ? 'uomo' : 'donna'}, ${p.age} anni, ${p.height} cm, ${p.weight} kg, livello ${LEVELS[p.level]}, obiettivo: ${GOALS[p.goal].l}, ${p.days} allenamenti a settimana (scheda ${STYLES[p.style || 'auto'].toLowerCase()}), attività quotidiana: ${ACT[p.activity]}.${p.example ? ' (Attenzione: sono ancora i valori di esempio, l\'utente non ha inserito i suoi dati: ricordaglielo se serve.)' : ''}
Target nutrizionali: ${n.kcal} kcal, proteine ${n.p} g, carboidrati ${n.c} g, grassi ${n.f} g.
Scheda: ${sp.map(d => d.n + ' = ' + d.ex.map(id => EX[id].n).join(', ')).join(' | ')}
Ultimi allenamenti:
${recent || 'nessuno ancora'}
Pesate: ${wts || 'nessuna'}
Oggi è ${iso()}.`;
}
const RULES = () => `Sei il coach di "Ghisa", un'app per chi va in palestra. Sei un personal trainer e nutrizionista sportivo esperto e parli in italiano, in modo diretto e incoraggiante, come un amico competente.
Regole: risposte brevi e pratiche (massimo 180 parole), elenchi puntati con "-" quando servono, niente tabelle né titoli con #. Basati sui dati dell'utente qui sotto. Se spieghi un esercizio, dai posizione di partenza, esecuzione, respirazione ed errori comuni. Non fare diagnosi: per dolore acuto, persistente o sintomi strani consiglia medico o fisioterapista. Niente farmaci, niente diete estreme.

${context()}`;
const QUICK = ['Com\'è andata la mia ultima settimana?', 'Cosa mangio prima e dopo l\'allenamento?', 'Mi spieghi l\'hip thrust passo per passo?', 'Sento fastidio al ginocchio nello squat, cosa cambio?', 'Ho solo 30 minuti oggi: come accorcio la seduta?'];
function fmtMsg(t){ return esc(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/^#+\s*/gm, ''); }
function renderCoach(){
  const el = $('#p-coach');
  if(chatBusy) return; // never wipe a reply while it is being written
  el.innerHTML = `
    <div><span class="eyebrow">Conosce la tua scheda, i tuoi pasti e i tuoi progressi</span><h2>Chiedi al coach</h2></div>
    <div class="card glass">
      <div class="chat" id="chatBox" aria-live="polite">${state.chat.length ? state.chat.map(m => `<div class="msg ${m.role === 'user' ? 'u' : 'a'}">${fmtMsg(m.content)}</div>`).join('') : `<div class="msg a">Ciao! Chiedimi qualsiasi cosa: come si fa un esercizio, cosa mangiare, come superare uno stallo. Vedo la tua scheda e i tuoi allenamenti.</div>`}</div>
      <div class="chiprow" id="quick">${QUICK.map(q => `<button class="chip" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>
      <form id="chatForm" style="display:grid;gap:8px">
        <label class="f" for="chatIn">La tua domanda</label>
        <textarea id="chatIn" rows="2" placeholder="Es. Come si fa il rematore con manubrio?"></textarea>
        <div class="row"><button class="btn primary" type="submit" id="chatSend">Invia</button><button class="btn sm" type="button" id="chatStop" hidden>Ferma</button>${state.chat.length ? `<button class="btn ghost sm" type="button" id="chatClear">Nuova conversazione</button>` : ''}</div>
        <p class="small muted" id="chatNote" aria-live="polite"></p>
      </form>
    </div>`;
  $('#quick').onclick = e => { const c = e.target.closest('[data-q]'); if(c){ $('#chatIn').value = c.dataset.q; ask(); } };
  $('#chatForm').onsubmit = e => { e.preventDefault(); ask(); };
  $('#chatIn').onkeydown = e => { if(e.key === 'Enter' && !e.shiftKey && !e.isComposing && matchMedia('(hover:hover)').matches){ e.preventDefault(); ask(); } };
  $('#chatStop').onclick = () => chatCtl && chatCtl.abort();
  const clr = $('#chatClear'); if(clr) clr.onclick = () => { state.chat = []; persist(); renderCoach(); };
}
async function ask(){
  const q = $('#chatIn').value.trim(); if(!q || chatBusy) return;
  chatBusy = true; $('#chatSend').disabled = true;
  const sample = await getSample();
  const box = $('#chatBox');
  if(!sample){ $('#chatNote').textContent = 'Il coach AI funziona aprendo questa pagina su claude.ai con il tuo account.'; chatBusy = false; $('#chatSend').disabled = false; return; }
  if(!state.chat.length) box.innerHTML = '';
  state.chat.push({role:'user', content:q});
  box.insertAdjacentHTML('beforeend', `<div class="msg u">${fmtMsg(q)}</div><div class="msg a" id="pending">${typing}</div>`);
  $('#chatIn').value = ''; $('#chatStop').hidden = false; $('#chatNote').textContent = '';
  const pend = $('#pending'); pend.scrollIntoView({block:'nearest', behavior: reduce ? 'auto' : 'smooth'});
  chatCtl = new AbortController();
  const turns = state.chat.slice(-12); while(turns.length && turns[0].role !== 'user') turns.shift();
  try{
    const {text} = await sample([{role:'user', content:RULES()}, ...turns], {cache:false, signal:chatCtl.signal, onText:({text}) => { pend.innerHTML = fmtMsg(text); }});
    state.chat.push({role:'assistant', content:text});
  }catch(e){
    if(e && e.text){ state.chat.push({role:'assistant', content:e.text}); pend.innerHTML = fmtMsg(e.text); }
    else { pend.remove(); }
    if(!(e && e.code === 'cancelled')) $('#chatNote').textContent = sampleErr(e && e.code);
  }
  pend.removeAttribute('id');
  if(state.chat.length > 30) state.chat = state.chat.slice(-30);
  chatBusy = false; $('#chatSend').disabled = false; $('#chatStop').hidden = true;
  if(!$('#chatClear')) $('#chatStop').insertAdjacentHTML('afterend', `<button class="btn ghost sm" type="button" id="chatClear">Nuova conversazione</button>`), $('#chatClear').onclick = () => { state.chat = []; persist(); renderCoach(); };
  persist();
}

/* ================= PROFILO ================= */
function renderProfilo(){
  const p = state.profile;
  const opt = (obj, v) => Object.entries(obj).map(([k, l]) => `<option value="${k}" ${String(v) === k ? 'selected' : ''}>${esc(typeof l === 'string' ? l : l.l)}</option>`).join('');
  const el = $('#p-profilo');
  el.innerHTML = `
    <div><span class="eyebrow">I calcoli partono da qui</span><h2>Il tuo profilo</h2></div>
    ${p.example ? `<div class="example"><span>Questi sono valori di esempio. Sostituiscili con i tuoi e premi Salva.</span></div>` : ''}
    <form class="card glass" id="pForm" novalidate>
      <div class="formgrid">
        <label class="f">Sesso<select id="pf-sex"><option value="m" ${p.sex === 'm' ? 'selected' : ''}>Uomo</option><option value="f" ${p.sex === 'f' ? 'selected' : ''}>Donna</option></select></label>
        <label class="f">Età<input id="pf-age" inputmode="numeric" value="${p.age}"></label>
        <label class="f">Altezza (cm)<input id="pf-height" inputmode="numeric" value="${p.height}"></label>
        <label class="f">Peso (kg)<input id="pf-weight" inputmode="decimal" value="${fmt(+p.weight)}"></label>
      </div>
      <div class="formgrid">
        <label class="f">Obiettivo<select id="pf-goal">${opt(GOALS, p.goal)}</select></label>
        <label class="f">Esperienza<select id="pf-level">${opt(LEVELS, p.level)}</select></label>
        <label class="f">Allenamenti a settimana<select id="pf-days">${[2,3,4,5,6].map(d => `<option value="${d}" ${+p.days === d ? 'selected' : ''}>${d}</option>`).join('')}</select></label>
        <label class="f">Pasti al giorno<select id="pf-meals">${[3,4,5].map(d => `<option value="${d}" ${+p.meals === d ? 'selected' : ''}>${d}</option>`).join('')}</select></label>
      </div>
      <div class="formgrid">
        <label class="f">Attività fuori dalla palestra<select id="pf-activity">${opt(ACT, p.activity)}</select></label>
        <label class="f">Organizzazione della scheda<select id="pf-style">${opt(STYLES, p.style || 'auto')}</select></label>
      </div>
      <p class="small" id="pErr" style="color:var(--red)" hidden></p>
      <div class="row"><button class="btn primary" type="submit">Salva profilo</button></div>
    </form>
    <div class="card glass"><h3>Colore dell'app</h3>
      <div class="swatches" role="group" aria-label="Colore principale">${ACCENTS.map(([k, l, c]) => `<button class="sw" data-accent="${k}" aria-pressed="${(p.accent || 'blu') === k}" aria-label="${l}" title="${l}" style="background:${c}"></button>`).join('')}</div>
      <p class="small muted" id="accName">${esc((ACCENTS.find(a => a[0] === (p.accent || 'blu')) || ACCENTS[0])[1])}</p>
    </div>
    <div class="card glass"><h3>Dove sono salvati i dati</h3>
      <p class="small">${SYNC.stateRef ? 'Nel tuo account Claude, visibili solo a te: li ritrovi su qualsiasi dispositivo da cui apri questa pagina.' : 'Solo in questo browser. Apri la pagina su claude.ai con il tuo account per salvarli nel tuo account.'}</p>
      <div id="resetBox" class="row"><button class="btn ghost sm" id="resetBtn">Cancella tutti i dati</button></div>
    </div>`;
  $('#pForm').onsubmit = e => {
    e.preventDefault();
    const g = k => $('#pf-' + k).value, err = $('#pErr');
    const age = num(g('age')), height = num(g('height')), weight = num(g('weight'));
    const bad = !(age >= 14 && age <= 90) ? ['age', 'L\'età deve essere tra 14 e 90 anni.'] : !(height >= 130 && height <= 220) ? ['height', 'L\'altezza deve essere tra 130 e 220 cm.'] : !(weight >= 30 && weight <= 300) ? ['weight', 'Il peso deve essere tra 30 e 300 kg.'] : null;
    if(bad){ err.textContent = bad[1]; err.hidden = false; $('#pf-' + bad[0]).focus(); haptic([10, 40, 10]); return; }
    state.profile = {...state.profile, sex:g('sex'), age:Math.round(age), height:Math.round(height), weight, goal:g('goal'), level:g('level'), days:+g('days'), meals:+g('meals'), activity:g('activity'), style:g('style'), example:false};
    const lw = sortedWeights().pop();
    if(!lw || Math.abs(lw.kg - weight) > 0.05){ state.weights = state.weights.filter(x => x.date !== iso()); state.weights.push({date:iso(), kg:weight}); }
    persist(); renderAll(); haptic(12); toast('Profilo salvato: scheda e piano aggiornati');
  };
  el.querySelectorAll('[data-accent]').forEach(b => b.onclick = () => {
    state.profile.accent = b.dataset.accent; applyAccent(); persist(); haptic(8);
    el.querySelectorAll('[data-accent]').forEach(x => x.setAttribute('aria-pressed', x === b));
    $('#accName').textContent = (ACCENTS.find(a => a[0] === b.dataset.accent) || ACCENTS[0])[1];
    requestAnimationFrame(placeIndicator);
  });
  $('#resetBtn').onclick = () => {
    $('#resetBox').innerHTML = `<span class="small">Vuoi cancellare profilo, allenamenti, pesate e chat? Non si può annullare.</span><button class="btn sm" id="rNo">Annulla</button><button class="btn sm primary" id="rYes">Cancella tutto</button>`;
    $('#rNo').onclick = renderProfilo;
    $('#rYes').onclick = () => {
      const ids = state.workouts.map(w => w.id);
      state = merge({pending: ids}); stopTimer(); lockScreen(false);
      persist(); renderAll(); toast('Dati cancellati');
    };
  };
}

/* ================= accent colour ================= */
const ACCENTS = [['blu','Blu','#2F6BD8'],['verde','Verde','#1E8A5A'],['viola','Viola','#6B4FD6'],['arancio','Arancio','#C9620E'],['grafite','Grafite','#2B323C']];
function applyAccent(){ const a = state.profile.accent; if(a && a !== 'blu') document.documentElement.dataset.accent = a; else delete document.documentElement.dataset.accent; }

/* ================= boot ================= */
function renderAll(keepTab){
  applyAccent();
  renderOggi(); renderScheda(); renderEsercizi(); renderNutrizione(); renderProgressi(); renderCoach(); renderProfilo();
  showTab(tab, {animate:false, scroll:false});
}
const local = loadLocal(); if(local) state = merge(local);
if(state.active && !state.active.ex) state.active = null;
renderAll();
$('#ind').style.transition = 'none';
placeIndicator();
requestAnimationFrame(() => { placeIndicator(); requestAnimationFrame(() => { $('#ind').style.transition = ''; loop(performance.now()); }); });
document.fonts && document.fonts.ready.then(placeIndicator);
setStatus('local');
initStore();
</script>
